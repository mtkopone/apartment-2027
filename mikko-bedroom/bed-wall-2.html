<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Headboard Wall 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: full-bleed 3D stage; spec card pinned top-left, control bar pinned bottom-centre. */
  :root {
    --bg: #e4e2dc;
    --panel: rgba(251, 250, 247, 0.88);
    --fg: #24221e;
    --muted: #6d685f;
    --line: rgba(36, 34, 30, 0.12);
    --accent: #8f5f32;
    --accent-fg: #fffaf3;
    --chip: #ebe8e1;
    --tag-bg: #141414;
    --tag-fg: #ffffff;
    --tag-soft-bg: rgba(20, 20, 20, 0.55);
    --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15130f; --panel: rgba(29, 27, 23, 0.86); --fg: #eeeae2; --muted: #a49e92;
      --line: rgba(238, 234, 226, 0.14); --accent: #d49a5f; --accent-fg: #1b140c; --chip: #2a2722;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15130f; --panel: rgba(29, 27, 23, 0.86); --fg: #eeeae2; --muted: #a49e92;
    --line: rgba(238, 234, 226, 0.14); --accent: #d49a5f; --accent-fg: #1b140c; --chip: #2a2722;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; }

  .spec {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
    max-width: calc(100% - 32px); width: 248px; max-height: calc(100vh - 32px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    display: grid; gap: 10px;
  }
  .spec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .spec-head > div { display: grid; gap: 10px; }
  .spec-body { display: grid; gap: 10px; }
  .spec.collapsed .spec-body { display: none; }
  .spec.collapsed { width: auto; }
  .fold { flex: none; width: 28px; height: 28px; border: 0; border-radius: 7px; background: var(--chip); color: var(--fg);
          font: 500 14px var(--font-ui); cursor: pointer; }
  .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spec .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .spec h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
  .spec dt { color: var(--muted); }
  .spec .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .spec dd { margin: 0; font-family: var(--font-num); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .features { border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0; padding: 8px 0; display: grid; gap: 4px; font-size: 13px; }
  .features legend { padding: 0 0 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .features label { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .features label.off { color: var(--muted); cursor: default; }
  .features .warn { color: var(--accent); font-size: 12px; margin-left: 2px; }
  .features input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  .dims { border-top: 1px solid var(--line); padding-top: 6px; }
  .dims summary { cursor: pointer; list-style: none; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); user-select: none; display: flex; align-items: center; gap: 6px; }
  .dims summary::-webkit-details-marker { display: none; }
  .dims summary::before { content: "\25BE"; font-size: 12px; }
  .dims:not([open]) summary::before { content: "\25B8"; }
  .dims dl { margin-top: 8px; }
  .interior .row { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; font-size: 12.5px; }
  .interior .row > span:first-child { color: var(--muted); }
  .interior .row .seg { justify-self: start; }
  .interior .row .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .interior .row input[type="range"] { accent-color: var(--accent); width: 100%; margin: 0; }
  .interior .row .btn { justify-self: start; background: var(--chip); }
  .features select { margin-left: auto; font: 500 12px var(--font-ui); color: var(--fg); background: var(--chip); border: 0; border-radius: 6px; padding: 4px 6px; max-width: 170px; }

  .look {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
    width: 272px; max-width: calc(100% - 32px); max-height: calc(100vh - 32px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    display: grid; gap: 10px; align-content: start;
  }
  .look.collapsed { width: auto; }
  .look.collapsed .look-body { display: none; }
  .look-body { display: grid; gap: 10px; }
  .look h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .moods { display: flex; flex-wrap: wrap; gap: 5px; }
  .moods button { font: 500 12px var(--font-ui); color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  .moods button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .surfaces { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  .surface > button {
    display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 9px; width: 100%; text-align: left;
    font: 500 13px var(--font-ui); color: var(--fg); background: transparent; border: 0; padding: 6px 4px; border-radius: 7px; cursor: pointer;
  }
  .surface > button:hover { background: var(--chip); }
  .surface .sw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line); }
  .surface .sum { font-size: 11.5px; color: var(--muted); }
  .surface .ctl { display: none; padding: 4px 4px 10px 31px; gap: 8px; }
  .surface.open .ctl { display: grid; }
  .ctl label { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .ctl select, .ctl input[type="range"] { width: 100%; min-width: 0; }
  .ctl select { font: 500 12px var(--font-ui); color: var(--fg); background: var(--chip); border: 0; border-radius: 6px; padding: 4px 6px; }
  .ctl input[type="range"] { accent-color: var(--accent); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chips button { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); padding: 0; cursor: pointer; }
  .chips button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips input[type="color"] { width: 22px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
  .look-actions { display: flex; gap: 6px; }
  @media (max-width: 900px) { .look { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 50vh; } }

  .seg { display: flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button, .btn {
    font: 500 12px var(--font-ui); color: var(--fg); background: transparent; border: 0;
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .btn { background: var(--chip); }
  .toggle { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 6px 10px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .toggle input[type="range"] { width: 90px; height: auto; }
  button:focus-visible, .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dim {
    font: 500 12px var(--font-num); font-variant-numeric: tabular-nums;
    background: var(--tag-bg); color: var(--tag-fg); padding: 3px 7px; border-radius: 5px; white-space: nowrap;
  }
  .dim.soft { background: var(--tag-soft-bg); }
  .busy {
    position: fixed; z-index: 6; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12.5px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none;
  }
  .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.is-busy, body.is-busy #stage canvas { cursor: progress !important; }
  .tip {
    position: fixed; z-index: 5; max-width: 280px; padding: 8px 10px; pointer-events: none;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 12.5px; line-height: 1.4;
  }
  .tip b { font-weight: 600; }

  @media (max-width: 560px) {
    .spec { width: auto; right: 16px; padding: 10px 12px; gap: 6px; }
    .spec dl { grid-template-columns: repeat(2, auto 1fr); }
  }
</style>

<div id="stage"><div id="labels"></div></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="busy" class="busy" role="status" aria-live="polite" hidden><span class="spin"></span>Updating lighting…</div>

<header class="spec" id="spec">
  <div class="spec-head">
    <div>
      <p class="eyebrow">Mikko's bedroom &middot; headboard wall</p>
      <h1>Headboard Wall 2</h1>
    </div>
    <button class="fold" id="btn-fold" aria-expanded="true" aria-controls="spec-body" title="Collapse the panel">&#9662;</button>
  </div>
  <div class="spec-body" id="spec-body">
  <fieldset class="features" aria-label="Features">
    <legend>Behind the headboard</legend>
    <label><input type="checkbox" data-feature="alcove"> Bed in the alcove</label>
    <label><input type="checkbox" data-feature="niches"> Niches in the uprights</label>
    <label><input type="checkbox" data-feature="tray"> Tray under lift-up lids</label>
    <label data-note="Probably not structurally sound: the uprights carry the cabinet above"><input type="checkbox" data-feature="pullouts"> Pull-out uprights <span class="warn" aria-label="caution">&#9888;</span></label>
    <label><input type="checkbox" data-feature="frame"> Storage bed frame</label>
  </fieldset>
  <fieldset class="features interior" aria-label="Interior">
    <legend>Interior</legend>
    <div class="row"><span>Light</span><div class="seg" role="group" aria-label="Lighting">
      <button id="btn-day" aria-pressed="true">Day</button>
      <button id="btn-evening" aria-pressed="false">Evening</button>
    </div></div>
    <div class="row"><span>Doors</span><div class="seg" role="group" aria-label="Cabinet doors">
      <button id="door-closed" aria-pressed="true">Closed</button>
      <button id="door-open" aria-pressed="false">Open</button>
    </div></div>
    <div class="row" id="seg-lids" hidden><span>Lids</span><div class="seg" role="group" aria-label="Ledge lids">
      <button id="lid-closed" aria-pressed="true">Closed</button>
      <button id="lid-open" aria-pressed="false">Open</button>
    </div></div>
    <label class="row" id="pullouts-toggle" hidden><span>Pull-outs</span><span class="chk"><input type="checkbox" id="opt-pullouts"> Out</span></label>
    <label class="row" id="beddrawers-toggle" hidden><span>Bed drawers</span><span class="chk"><input type="checkbox" id="opt-beddrawers"> Out</span></label>
    <label class="row"><span>Mirror LED</span><input type="range" id="led-dim" min="0" max="100" value="70" aria-label="Mirror LED brightness"></label>
    <label class="row"><span>Lamp</span><select id="opt-lamp" data-interior="lamp">
      <option value="brass">Brass dome lamp</option>
      <option value="rondo">Innolux Rondo Air</option>
    </select></label>
    <div class="row"><span>Pillows</span><div class="seg" role="group" aria-label="Pillows">
      <button id="pillows-small" aria-pressed="true">Small</button>
      <button id="pillows-big" aria-pressed="false">Big</button>
    </div></div>
    <label class="row" title="A flashlight that follows the cursor, for looking into dark corners"><span>Flashlight</span><span class="chk"><input type="checkbox" id="opt-torch"> On</span></label>
    <label class="row"><span>Dimensions</span><span class="chk"><input type="checkbox" id="opt-dims" checked> Show</span></label>
    <div class="row"><span>View</span><button class="btn" id="btn-reset">Reset view</button></div>
  </fieldset>
  <details class="dims" id="dims-fold" open>
    <summary>Dimensions</summary>
    <dl id="spec-list"></dl>
  </details>
  <p class="hint">Click doors, drawers, the lamps, the LED strip and the curtain to work them.</p>
  </div>
</header>

<aside class="look" id="look" aria-label="Materials and colours">
  <div class="spec-head">
    <h2>Look</h2>
    <button class="fold" id="btn-fold-look" aria-expanded="true" aria-controls="look-body" title="Collapse the panel">&#9662;</button>
  </div>
  <div class="look-body" id="look-body">
    <div class="moods" id="moods" role="group" aria-label="Moods"></div>
    <div class="surfaces" id="surfaces"></div>
    <div class="look-actions">
      <button class="btn" id="btn-copy">Copy link</button>
      <button class="btn" id="btn-look-reset" title="Back to the look as drawn">Reset look</button>
    </div>
  </div>
</aside>


<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Everything you might want to fiddle with. All measurements in cm.
// Based on the designer's elevation "Mikon huoneen sängynpäätyseinä" (indicative 1:20) and the floor plan.
//
// With everything in `features` off, this is the wall as drawn. The features are the ideas for
// the space behind the headboard, switched from the checkboxes in the spec card (or the URL hash,
// e.g. #alcove,niches). Two pairs exclude each other: the alcove removes the volume the tray
// needs, and the niches and pull-outs both remodel the uprights.
//
// Coordinates: x runs along the headboard wall (0 = the box's left edge, next to the door frame),
// z runs into the room from the wall, y is height above the floor.
//
// The headboard wall is a floor-to-ceiling box ("kotelo"), about 190 wide, 259 high and 25 deep:
// a big frame painted in a dark tone, a mirror recess in the middle with a dimmable LED strip
// along its front edge, and storage above behind three walnut doors (walnut frame round them).
// A separate upholstered headboard stands in front of the lower panel. A 70 mm skirting runs
// round the box, and there is a service hatch low on the right. The box butts against the
// door frame on the left, painted F485 Damasti; the box's dark top band carries on over the
// opening to the left wall (no transom window). There is no door for now, just a wine-red curtain.
// The right-hand wall and the wall opposite it carry Rebel Walls "Blooming Bouquet, Dark": a mural
// printed to the wall's height that repeats horizontally, loaded from the Rebel Walls image CDN
// (a procedurally drawn stand-in is used if the image cannot be fetched).
// ---------------------------------------------------------------------------
const CONFIG = {
  features: {           // what to do with the space behind the headboard; all off = as drawn
    alcove: false,      // open the lower box so the bed stands in it, headboard fixed to the wall
    niches: false,      // open bedside slots in the front of the uprights
    tray: false,        // the ledge becomes lift-up lids over a 20 cm tray behind the headboard
    pullouts: false,    // the lower part of each upright becomes a tall pull-out bedside unit
    frame: false,       // the bed on a MALM-style platform frame with drawers
  },
  interior: {           // loose things that can be swapped from the panel
    lamp: 'brass',      // 'brass': the drawing's brass dome lamp; 'rondo': Innolux Rondo Air bright light (Ø 30 cm, 24 W, 4000 K, 2040 lm)
  },
  room: {
    ceiling: 259,       // lowered ceiling; the box runs floor to ceiling
    xMin: -72,          // left wall; the headboard wall is 262 wide (floor plan: 2.59 m)
    depth: 434,         // floor plan: 4.34 m along the right-hand wall
    door: { x0: -64, x1: -4, panelFrom: 243, rod: 241, jamb: 4, trim: 7 },   // 60 cm clear opening; the dark band starts at panelFrom, curtain rod just under it
    ceilingLight: { x: 59, z: 217 },
    opening: { z0: 205, z1: 305, height: 210 },   // doorless opening in the left-hand wall (floor plan: 2.05 to 3.07 m from the bed wall)
    wallpaper: {                        // https://rebelwalls.com/fi/blooming-bouquet-dark (R21615)
      url: 'https://res.rebelwalls.com/gimmersta-wallpaper/image/upload/v1747128839/articles/R21615_product.jpg',
      aspect: 2000 / 829,               // the strip is this many wall-heights wide, then repeats
      offsets: { right: 0, left: 0.45 }, // which part of the strip each wall starts from (0..1)
    },
  },
  wall: {
    width: 190, depth: 25, height: 259,
    pilaster: 13,       // dark painted uprights either side of the recess
    topRail: 10,
    skirting: 7,        // 70 mm skirting runs round the box
    ledgeTop: 113,      // top of the lower panel = the shelf at the bottom of the mirror recess
    alcove: { ledgeTop: 148, mirrorTop: 184, doorsBottom: 187, knobY: 196, shelf: 215, headboardTop: 113 },   // with the bed in the alcove the ledge's underside is at 145, clear of someone sitting up with a laptop; the headboard stops 30 cm short of it
    ledge: 3,
    mirror: { top: 160 },                 // optiwhite mirror from the ledge up to the walnut rail
    led: { lip: 2, default: 0.7 },        // dimmable LED strip hidden behind a lip along the recess's top front edge
    walnutFrame: 3,                       // walnut frame round the upper doors
    doors: { bottom: 163, top: 246, hinges: ['left', 'right', 'right'], thickness: 2, inlay: 3, knobY: 172 },
    shelf: 205,                           // shelf inside the upper cabinet
    hatch: { x: 178, y: 10, w: 11, h: 40 },
    lamp: { x: 48, z: 12 },               // brass table lamp on the ledge, cable through a grommet
    niches: { w: 9, d: 20, slots: [            // open slots in the front of each upright, bottom to top: height above floor, height, what it holds
      { y: 60, h: 12, holds: 'phone', outlets: { sockets: 1, usbc: 2 } },   // phone on a wireless charging pad; a socket plate on the upright's face just below the niche
      { y: 76, h: 16, holds: 'glasses' },        // reading glasses, or whatever
      { y: 96, h: 27, holds: 'bottle' },         // a 0.5 l soda bottle standing up
    ] },
    lids: { fixed: [13, 47], split: [112], depth: 20, lampX: 30 },   // fixed ledge section round the lamp (moved to lampX); lids between the remaining edges; tray depth
    pullouts: { shelves: [28, 56, 84], travel: 24 },        // shelf heights inside each pull-out unit, and how far it slides out
  },
  bed: {                                  // continental bed with a gingham base, 160 x 200, centred in the recess
    width: 160, length: 200, legs: 9, baseTop: 51, topperTop: 58,
    frame: {                              // MALM-style platform frame round the mattress, drawers in its lower band
      width: 183, height: 38, side: 8, sideRight: 15, mattressTop: 59,   // 8 cm rails, but the right one 15 so the frame meets the wall (a ledge, no gap to clean); frame 38 + a 22 cm mattress
      // The frame always starts at the box front and its length follows from the mattress: 217 with the
      // headboard in front of the box, 192.5 with the bed in the alcove (the uprights then form its head end).
      drawers: { height: 15, depth: 62, travel: 54,
                 left: [[14, 97], [116, 97]],  // [offset from the box, width]: two along the left side, clear of the headboard
                 foot: [[91, 80]] },           // [offset from the left, width]: one at the foot, right half, clear of the left drawers
    },
    headboard: { width: 164, bottom: 10, top: 108, thickness: 8 },   // separate upholstered headboard, recess width (fixed to the wall in the alcove)
    pillows: 2,
  },
};

// The features change a few numbers; this derives the wall and bed the builders actually use.
function effective() {
  const F = CONFIG.features, w = structuredClone(CONFIG.wall), b = structuredClone(CONFIG.bed);
  if (F.alcove) {
    const al = w.alcove;
    w.ledgeTop = al.ledgeTop; w.mirror.top = al.mirrorTop; w.doors.bottom = al.doorsBottom; w.doors.knobY = al.knobY; w.shelf = al.shelf;
    b.headboard.top = al.headboardTop;
  }
  if (F.tray) w.lamp.x = w.lids.lampX;
  if (F.frame) b.topperTop = b.frame.mattressTop; else b.frame = null;
  return { wall: w, bed: b };
}
let EFF = effective();

const M = 0.01; // cm -> scene metres
const LIGHTING = {
  day:     { bg: 0xdcdbd5, hemi: 1.05, hemiSky: 0xf2f5ff, hemiGround: 0xa89c90, sun: 2.6, env: 0.55, lamp: 0,   glow: 0,  exposure: 1.0 },
  evening: { bg: 0x14110e, hemi: 0.05, hemiSky: 0x5a4a3a, hemiGround: 0x2a2018, sun: 0,   env: 0.05, lamp: 6, glow: 5,  exposure: 1.05 },
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------------------
// Renderer, scene, camera
// ---------------------------------------------------------------------------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------------------------------------------------------------------------
// Materials & textures
// ---------------------------------------------------------------------------
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function canvasTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function parquetTexture() {
  // Mosaic (basket-weave) oak parquet: square blocks of parallel strips, alternating direction like
  // a chequerboard. Freshly sanded and waxed, so the strips are close in tone with no grey ones.
  const strip = 16 / 6, perBlock = 6, blocks = 12, pxPerCm = 6;    // 16 cm blocks of six strips, 192 cm tile
  const blockCm = strip * perBlock, S = blocks * blockCm * pxPerCm;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(S, S);
  const rand = mulberry32(7);
  const tones = Array.from({ length: blocks * blocks * perBlock }, () => {
    const grey = 0;                                                     // sanded: no weathered strips
    return { l: 0.93 + rand() * 0.09, grey, phase: rand() * 100, freq: 4 + rand() * 3, knot: rand() };   // tight tone spread
  });
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const cx = x / pxPerCm, cy = y / pxPerCm;
      const bx = Math.floor(cx / blockCm), by = Math.floor(cy / blockCm);
      const lx = cx - bx * blockCm, ly = cy - by * blockCm;
      const vertical = (bx + by) % 2 === 0;
      const across = vertical ? lx : ly, along = vertical ? ly : lx;
      const si = Math.min(perBlock - 1, Math.floor(across / strip));
      const t = tones[((by * blocks + bx) * perBlock) + si];
      const a = across - si * strip;
      const wob = 0.7 * Math.sin(along * 0.08 + t.phase) + 0.25 * Math.sin(along * 0.31 + t.phase * 2);
      const arch = t.knot > 0.7 ? 3 / (1 + Math.pow((along - t.knot * blockCm) * 0.25, 2)) : 0;
      const g = Math.sin((a + wob + arch) * t.freq + t.phase);
      const fine = Math.sin(along * 0.9 + a * 13 + t.phase);
      let l = t.l * (1 - 0.06 * Math.pow(g * 0.5 + 0.5, 3) - 0.015 * fine) + (rand() - 0.5) * 0.03;
      if (a < 0.12 || a > strip - 0.12) l *= 0.82;
      if (lx < 0.15 || lx > blockCm - 0.15 || ly < 0.15 || ly > blockCm - 0.15) l *= 0.72;
      const r = 186 * l, gg = 155 * l, b = 118 * l, m = (r + gg + b) / 3;
      const i = (y * S + x) * 4;
      img.data[i]     = Math.min(255, r + (m - r) * t.grey);
      img.data[i + 1] = Math.min(255, gg + (m - gg) * t.grey);
      img.data[i + 2] = Math.min(255, b + (m - b) * t.grey);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = canvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.userData.tileCm = blocks * blockCm;
  return tex;
}

// Dark walnut veneer: fine vertical grain with lighter streaks that fade in and out along their length.
function walnutTexture(base = [82, 53, 35]) {
  const Wd = 512, Hd = 2048;
  const canvas = document.createElement('canvas'); canvas.width = Wd; canvas.height = Hd;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(Wd, Hd);
  const rand = mulberry32(11);
  const raw = Array.from({ length: Wd }, () => rand());
  const col = raw.map((v, i) => (raw[(i + Wd - 1) % Wd] + 2 * v + raw[(i + 1) % Wd]) / 4);
  const freq = Array.from({ length: Wd }, () => 0.002 + rand() * 0.006);
  const phase = Array.from({ length: Wd }, () => rand() * 100);
  for (let y = 0; y < Hd; y++) {
    for (let x = 0; x < Wd; x++) {
      const u = x + 5 * Math.sin(y * 0.0025 + x * 0.004) + 1.5 * Math.sin(y * 0.009 + x * 0.02);
      const i0 = ((Math.floor(u) % Wd) + Wd) % Wd, i1 = (i0 + 1) % Wd, f = u - Math.floor(u);
      const c = col[i0] * (1 - f) + col[i1] * f;
      const streak = 0.55 + 0.45 * Math.sin(y * freq[i0] + phase[i0]);
      const dark = Math.pow(c, 3) * streak;
      const l = 1.05 - 0.55 * dark + 0.04 * Math.sin(u * 0.025 + 2) + (rand() - 0.5) * 0.03;
      const i = (y * Wd + x) * 4;
      img.data[i] = Math.min(255, base[0] * l);
      img.data[i + 1] = Math.min(255, base[1] * l * (1 - 0.05 * dark));
      img.data[i + 2] = Math.min(255, base[2] * l * (1 - 0.12 * dark));
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvasTexture(canvas);
}

// Gingham check for the bed base: 4 cm squares in cream and a muted plum-brown (measured off the
// drawing), with a woven texture.
function ginghamTexture(cream = [240, 231, 218], dark = [112, 78, 78], sizeCm = 4, pattern = 'gingham') {
  const S = 256, sq = S / 2;                                // 2 x 2 squares per tile, tile = 2 squares
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(S, S);
  const rand = mulberry32(5);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const w = pattern === 'plain' ? 0 : pattern === 'stripe' ? (Math.floor(x / sq) % 2) : ((Math.floor(x / sq) % 2) + (Math.floor(y / sq) % 2)) / 2;
    const weave = ((x >> 1) + (y >> 1)) % 2 ? 6 : -6;
    const i = (y * S + x) * 4;
    for (let c = 0; c < 3; c++) img.data[i + c] = Math.max(0, Math.min(255, cream[c] + (dark[c] - cream[c]) * w + weave + (rand() - 0.5) * 8));
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = canvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.userData.tileCm = 2 * sizeCm;
  return tex;
}

// Fine plain weave for linen and cotton: a 2 cm tile of crossing threads, used as a bump map.
function linenTexture() {
  const S = 128;
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(S, S);
  const rand = mulberry32(17);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const over = ((x >> 2) + (y >> 2)) % 2, tx = x % 4, ty = y % 4;
    const ridge = over ? 1 - Math.abs(tx - 1.5) / 2.5 : 1 - Math.abs(ty - 1.5) / 2.5;
    const l = 0.55 + 0.4 * ridge + (rand() - 0.5) * 0.08;
    const i = (y * S + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.max(0, Math.min(255, 255 * l));
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = canvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.userData.tileCm = 2;
  return tex;
}

// Stand-in wallpaper used until the real mural loads (or if it cannot be fetched): big painterly
// peonies in dusty pink, rust and cream on near-black, with dark foliage, on a seamless 160 cm tile.
function floralTexture() {
  const S = 1024;
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');
  const rand = mulberry32(21);
  ctx.fillStyle = '#121715'; ctx.fillRect(0, 0, S, S);
  const wrapped = fn => { for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) { ctx.save(); ctx.translate(dx, dy); fn(); ctx.restore(); } };
  const rgb = (c, k, a = 1) => `rgba(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0},${a})`;
  // A pointed leaf along +x from the origin, with a lighter midrib
  const leaf = (len, wid, col) => {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.3, -wid, len * 0.8, -wid * 0.6, len, 0);
    ctx.bezierCurveTo(len * 0.8, wid * 0.6, len * 0.3, wid, 0, 0);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(150,175,140,0.3)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(len * 0.05, 0); ctx.lineTo(len * 0.92, 0); ctx.stroke();
  };
  // A petal along +x from the flower centre: dark at the base, light and slightly ruffled at the tip
  const petal = (len, wid, col, shade) => {
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, rgb(col, shade * 0.35));
    g.addColorStop(0.55, rgb(col, shade * 0.85));
    g.addColorStop(1, rgb(col, shade * 1.25 + 0.1));
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.15, -wid * 0.7, len * 0.85, -wid * 0.95, len, -wid * 0.15);
    ctx.quadraticCurveTo(len * 0.93, 0, len, wid * 0.15);
    ctx.bezierCurveTo(len * 0.85, wid * 0.95, len * 0.15, wid * 0.7, 0, 0);
    ctx.fillStyle = g; ctx.fill();
  };
  // Dark foliage underlay all over
  for (let i = 0; i < 90; i++) {
    const x = rand() * S, y = rand() * S, len = 60 + rand() * 110, rot = rand() * Math.PI * 2;
    const col = `rgba(${22 + rand() * 18},${40 + rand() * 22},${32 + rand() * 14},0.9)`;
    wrapped(() => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); leaf(len, len * 0.28, col); ctx.restore(); });
  }
  const palettes = [[205, 150, 150], [160, 86, 72], [222, 196, 176], [132, 76, 90], [184, 104, 86], [214, 168, 158], [236, 220, 200]];
  const cells = [[0.2, 0.22], [0.62, 0.12], [0.88, 0.5], [0.42, 0.52], [0.12, 0.8], [0.58, 0.86]];
  const flowers = cells.map(([u, v]) => ({
    x: (u + (rand() - 0.5) * 0.12) * S, y: (v + (rand() - 0.5) * 0.12) * S,
    r: 95 + rand() * 60, col: palettes[Math.floor(rand() * palettes.length)],
  }));
  for (const f of flowers) {
    // Brighter leaves fanning out from behind the bloom
    for (let k = 0; k < 6; k++) {
      const a = rand() * Math.PI * 2, d = f.r * (0.35 + rand() * 0.35), len = f.r * (0.8 + rand() * 0.5);
      const col = `rgba(${40 + rand() * 24},${70 + rand() * 30},${50 + rand() * 20},0.95)`;
      wrapped(() => { ctx.save(); ctx.translate(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d); ctx.rotate(a); leaf(len, len * 0.3, col); ctx.restore(); });
    }
    const rings = 5, spin = rand() * Math.PI * 2;
    wrapped(() => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 18;
      for (let ring = 0; ring < rings; ring++) {
        const len = f.r * (1 - ring * 0.17), n = 12 - ring * 2, shade = 0.55 + ring * 0.1;
        for (let i = 0; i < n; i++) {
          const a = spin + ring * 0.3 + (i / n) * Math.PI * 2 + (rand() - 0.5) * 0.3;
          ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(a);
          petal(len * (0.9 + rand() * 0.2), len * (0.34 + rand() * 0.1), f.col, shade + (rand() - 0.5) * 0.12);
          ctx.restore();
        }
      }
      ctx.restore();
      // Heart of the bloom: a tight cluster of small petals and a few pale stamens
      for (let i = 0; i < 9; i++) {
        const a = rand() * Math.PI * 2;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(a); petal(f.r * 0.22, f.r * 0.09, f.col, 1.05); ctx.restore();
      }
      for (let i = 0; i < 7; i++) {
        const a = rand() * Math.PI * 2, d = rand() * f.r * 0.08;
        ctx.fillStyle = 'rgba(240,222,180,0.85)'; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 2, 0, Math.PI * 2); ctx.fill();
      }
    });
  }
  // A few buds in the gaps
  for (let i = 0; i < 6; i++) {
    const x = rand() * S, y = rand() * S, r = 24 + rand() * 18, col = palettes[Math.floor(rand() * palettes.length)], spin = rand() * Math.PI * 2;
    wrapped(() => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(spin);
      for (let k = 0; k < 5; k++) { ctx.rotate(Math.PI * 2 / 5); petal(r, r * 0.4, col, 0.55); }
      ctx.restore();
    });
  }
  // A faint paper grain
  const img = ctx.getImageData(0, 0, S, S);
  for (let i = 0; i < img.data.length; i += 4) { const n = (rand() - 0.5) * 10; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  const tex = canvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.userData.tileCm = 160;
  return tex;
}

// Coarse upholstery for the headboard: a bouclé-like weave of small loops, drawn as a seamless
// 8 cm tile and used both for colour variation and as a bump map.
function boucleTexture() {
  const S = 256, loop = 8;                                   // 8 cm tile, loops about 2.5 mm across
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(S, S);
  const rand = mulberry32(13), n = S / loop;
  const cells = Array.from({ length: n * n }, () => ({ dx: (rand() - 0.5) * 4, dy: (rand() - 0.5) * 4, tone: 0.9 + rand() * 0.2, r: loop * (0.42 + rand() * 0.12) }));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let l = 0.72;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {   // nearest loops, wrapping at the edges
      const cx = Math.floor(x / loop) + i, cy = Math.floor(y / loop) + j;
      const c = cells[((cy + n) % n) * n + (cx + n) % n];
      const px = cx * loop + loop / 2 + c.dx, py = cy * loop + loop / 2 + c.dy;
      const d = Math.hypot(x - px, y - py) / c.r;
      if (d < 1) l = Math.max(l, c.tone * (1 - 0.3 * d * d));
    }
    l += (rand() - 0.5) * 0.06;
    const i = (y * S + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.max(0, Math.min(255, 255 * l));
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = canvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 12);
  return tex;
}
const boucle = boucleTexture();

// Load the real mural from the Rebel Walls CDN and put it on the papered walls once it arrives.
const papered = [];   // { mesh, length } for each wall carrying the wallpaper
function paperWall(mesh, lengthCm, offset) {
  mesh.material = mat.floral;
  papered.push({ mesh, length: lengthCm, offset });
  fitWallpaper();
}
function fitWallpaper() {
  const wp = CONFIG.room.wallpaper, C = CONFIG.room.ceiling;
  if (LOOK?.wl.mode === 'paint') { for (const { mesh } of papered) mesh.material = mat.wallPaint; return; }
  for (const { mesh, length, offset } of papered) {
    // Wall meshes are ShapeGeometry, so their UVs are in scene metres along the wall and up it
    if (mat.floral.map.userData.mural) {           // the real strip: one wall-height tall, repeats sideways
      const tex = mesh.userData.tex ??= mat.floral.map.clone();
      tex.repeat.set(1 / (C * M * wp.aspect), 1 / (C * M));
      tex.offset.set(offset, 0);
      mesh.material = mesh.userData.mat ??= new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
    } else {
      const tex = mat.floral.map;
      mesh.material = mat.floral;
      tex.repeat.set(1 / (tex.userData.tileCm * M), 1 / (tex.userData.tileCm * M));
    }
  }
}
new THREE.TextureLoader().setCrossOrigin('anonymous').load(CONFIG.room.wallpaper.url, tex => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.userData.mural = true;
  mat.floral.map = tex;
  fitWallpaper();
}, undefined, () => console.warn('Wallpaper image could not be loaded; using the drawn stand-in.'));

const cloth = new Map();
function clothMat(hex) {
  if (!cloth.has(hex)) cloth.set(hex, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.95 }));
  return cloth.get(hex);
}
let baseTex = ginghamTexture();                   // the bed base's pattern, replaced by the Look panel
const baseMats = [];                              // one material per base face, so the pattern can be swapped in place
function ginghamMat(wCm, hCm) {
  const m = new THREE.MeshStandardMaterial({ roughness: 1 });
  m.userData = { wCm, hCm };
  baseMats.push(m);
  fitBaseMat(m);
  return m;
}
function fitBaseMat(m) {
  const tex = baseTex.clone();
  tex.repeat.set(m.userData.wCm / baseTex.userData.tileCm, m.userData.hCm / baseTex.userData.tileCm);
  tex.needsUpdate = true;
  m.map = tex; m.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// Look: materials and colours, from the panel top-right. Every surface has a few fields; a mood is

  // Headboard wall left of the box: a stub of wall, then the door opening with its frame.
  // The wall is 10 cm thick; a short passage lies behind the opening.
  g.add(box(door.x0 - door.jamb - ROOM.xMin, C, 10, ROOM.xMin, 0, -10, mat.wall));
  const P = ROOM.passage;
  const pf = plane(-ROOM.xMin, P, parquetFor(-ROOM.xMin, P)); pf.rotation.x = -Math.PI / 2; pf.position.set(ROOM.xMin / 2 * M, 0, -P / 2 * M);   // the same parquet runs on through the doorway
  const pc = plane(-ROOM.xMin, P, mat.ceiling); pc.rotation.x = Math.PI / 2; pc.position.set(ROOM.xMin / 2 * M, C * M, -P / 2 * M);
  g.add(pf, pc);
  g.add(box(-ROOM.xMin, C, 1, ROOM.xMin, 0, -P - 1, mat.passage));
  g.add(box(1, C, P, ROOM.xMin - 1, 0, -P, mat.passage));
  g.add(box(1, C, P - 10, 0, 0, -P, mat.passage));

  // Door frame in F485 Damasti: jambs and trim on the room side, up to the dark band. The box's
  // top rail carries on over the opening to the left wall, closing it above the curtain rod
  // (no transom window). The box butts against the right-hand trim. No door for now.
  const PF = door.panelFrom;
  g.add(box(door.jamb, PF, 10, door.x0 - door.jamb, 0, -10, mat.damasti));
  g.add(box(door.jamb, PF, 10, door.x1, 0, -10, mat.damasti));
  g.add(box(door.trim, PF, 1.2, door.x0 - door.jamb - 3, 0, 0, mat.damasti));
  g.add(box(-door.x1, PF, 1.2, door.x1, 0, 0, mat.damasti));
  g.add(box(-ROOM.xMin, C - PF, 10 + EFF.wall.depth, ROOM.xMin, PF, -10, mat.paint));

  // Eyelet curtain on a slim rod inside the opening
  const curtain = buildCurtain(door.x0, door.x1, door.rod, -5);
  g.add(curtain);
  g.userData.curtain = curtain.userData.slide;

  // Skirting on the plain walls (the box has its own, in its dark colour)
  g.add(box(1.2, 7, op.z0 - 1, ROOM.xMin, 0, 0, mat.trim));
  g.add(box(1.2, 7, L - op.z1 - 1, ROOM.xMin, 0, op.z1 + 1, mat.trim));
  g.add(box(1.2, 7, ROOM.zFront - EFF.wall.depth, W - 1.2, 0, EFF.wall.depth, mat.trim));

  // Flush ceiling light in the middle of the room (the room's general light in the evening)
  const cl = CONFIG.room.ceilingLight;
  const disc = placed(new THREE.CylinderGeometry(14 * M, 15 * M, 2 * M, 40), mat.glow, cl.x, C - 1, cl.z);
  disc.castShadow = false;
  disc.userData.click = () => setCeiling(!state.ceilingOn);
  g.add(disc);
  return g;
}

// Curtain: a gathered panel with soft vertical folds, hanging from rings on the rod to just off the floor.
function buildCurtain(x0, x1, rodY, z) {
  const g = new THREE.Group();
  const w = x1 - x0, bottom = 1.5, h = rodY - 2 - bottom, waves = 7, amp = 0.8 + 4 * (LOOK?.cu.folds ?? 60) / 100;   // fold depth from the Look panel
  const rod = placed(new THREE.CylinderGeometry(0.8 * M, 0.8 * M, (w + 2) * M, 16), mat.brass, (x0 + x1) / 2, rodY, z);
  rod.rotation.z = Math.PI / 2; rod.castShadow = false;
  g.add(rod);
  for (const x of [x0, x1 - 1]) g.add(box(1, 2, 3, x, rodY - 1, z - 1.5, mat.brass, { cast: false }));
  const geo = new THREE.PlaneGeometry(w * M, h * M, 140, 1);
  const pos = geo.attributes.position;
  const rand = mulberry32(9), jitter = Array.from({ length: waves * 2 + 2 }, () => (rand() - 0.5) * 0.35);
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i) / (w * M) + 0.5, ph = u * Math.PI * 2 * waves;
    const j = jitter[Math.floor(u * waves * 2)] ?? 0;
    pos.setZ(i, (Math.cos(ph + j) * (0.85 + 0.15 * Math.sin(u * 11 + 1)) + 0.22 * Math.sin(ph * 2 + 0.8) + 0.08 * Math.sin(u * 23)) * amp * M);
  }
  geo.computeVertexNormals();
  // The panel and its rings sit in a group anchored at the left jamb; drawing the curtain open
  // squashes the group towards that side, which bunches the folds up like a real curtain.
  const slide = new THREE.Group();
  slide.position.set(x0 * M, 0, 0);
  const panel = new THREE.Mesh(geo, mat.curtain);
  panel.position.set(w / 2 * M, (bottom + h / 2) * M, z * M);
  panel.castShadow = true; panel.receiveShadow = true;
  slide.add(panel);
  for (let k = 0; k <= waves * 2; k++) {                       // eyelet rings on every crest and trough
    const x = (k / (waves * 2)) * w;
    const ring = placed(new THREE.TorusGeometry(2 * M, 0.3 * M, 8, 24), mat.brass, Math.min(Math.max(x, 2.5), w - 2.5), rodY, z);
    ring.rotation.y = Math.PI / 2; ring.castShadow = false;
    slide.add(ring);
  }
  slide.userData.click = () => setCurtain(!state.curtainOpen);
  g.add(slide);
  g.userData.slide = slide;
  return g;
}
