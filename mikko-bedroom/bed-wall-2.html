const reflectors = [];
function mirrorPlane(w, h) {
  // Optiwhite (low-iron) glass: a neutral tint rather than the usual green
  const m = new Reflector(new THREE.PlaneGeometry(w * M, h * M), { textureWidth: 2048, textureHeight: 1024, color: 0xd6d9d8 });
  reflectors.push(m);
  return m;
}

// Notes shown as tooltips when the cursor rests on a part: why things are the size they are, and
// what the electrics do. Niche and tray notes take their numbers from CONFIG.
const TIPS = {
  phone: (sl, n) => `<b>Phone niche</b>, ${fmt(sl.h)} cm tall, ${fmt(n.w)} wide, ${fmt(n.d)} deep. The phone lies flat on a wireless charging pad let into the floor, wired from inside the upright, so there is normally no cable in sight. The socket plate just below the niche covers everything else. Tall enough to get fingers under the phone.`,
  nicheOutlets: o => `<b>Socket plate</b> under the phone niche, Schneider Exxact in anthracite: ${o.usbc} USB-C port${o.usbc > 1 ? 's' : ''} on top and ${o.sockets} Schuko socket${o.sockets > 1 ? 's' : ''} below, flush in the upright's face at about 50 cm, reachable from the pillow. USB-C with Power Delivery charges a laptop, tablet or earbuds; the Schuko takes a lamp or anything else. Both uprights have one.`,
  glasses: (sl, n) => `<b>Glasses niche</b>, ${fmt(sl.h)} cm tall. Room for folded reading glasses, a watch or a paperback on edge. No electrics here; it is the one that stays empty.`,
  bottle: (sl, n) => `<b>Bottle niche</b>, ${fmt(sl.h)} cm tall. A Finnish 0.5 l plastic bottle is about 23 cm, so it lifts in and out upright without tilting, with ${fmt(n.w)} cm of width leaving a finger's room either side.`,
  tray: (iw, depth, d) => `<b>Tray</b> behind the headboard, ${fmt(iw)} × ${fmt(depth)} × ${fmt(d)} cm, under the two lids only. Shallow on purpose: ${fmt(depth)} cm means everything is reachable from above while kneeling on the bed, and nothing gets buried. The part under the lamp is a closed compartment for the electrics.`,
  trayPower: () => `<b>Power in the tray</b>: two Schuko sockets and two USB-C ports on a plate at the lamp end, facing into the tray. The compartment behind it, under the lamp's fixed ledge, holds the wiring and shares the lamp's feed. USB-C with Power Delivery charges a phone or tablet without a charger brick. Worth confirming with the electrician how they want sockets inside furniture done.`,
  trayLed: () => `<b>Tray LED</b>: neutral-white strip along the back under the hinge rail, on a lid sensor. It comes on as a lid lifts and goes off when both are down, so nothing to switch.`,
  lid: () => `<b>Lift-up lid</b>: a 3 cm panel on a hinge rail just in front of the mirror, opening to about 80° on a lid stay that holds it there, a couple of centimetres clear of the glass. Finger groove along the front edge; no handle to catch pillows on.`,
  lamp: () => `<b>Table lamp</b> on the ledge, its cable dropping through a brass grommet to a socket inside the box, as the drawing notes ("läpivienti"). Click to switch it.`,
  mirrorLed: () => `<b>Mirror LED</b>: a dimmable strip hidden behind a 2 cm lip on the front edge of the recess, lighting the mirror and the ledge. Drag the slider to dim, click the strip to switch.`,
  rondo: () => `<b>Innolux Rondo Air</b> bright light on the ledge: a flat white disc, 300 × 150 mm with its foot, 24 W LED at 4000 K giving 2040 lm. Innolux rates it 2500 lx at 55 cm and 10 000 lx at 26 cm, so it is a light-therapy lamp rather than a reading light. Not dimmable; the only control is the switch on the cord. The cable drops through the grommet like the brass lamp's. Click to switch it.`,
  pullout: () => `<b>Pull-out upright</b>, 13 × 25 cm, lipped shelves open on both sides. <b>Probably not structurally sound as drawn:</b> the uprights are what carry the top rail, the cabinet and the mirror recess, and this removes the lower metre of each. Everything above would hang off its fixings to the back wall alone. It could all be bolted to the wall, but it is not clear the wall will take it, and a real version would need a fixed structural shell with a much narrower drawer, about 8 cm, running inside it. The niches do the same job with no structural cost.`,
  pad: () => `<b>Wireless charging pad</b>, flush in the niche floor and 2 mm proud so the phone finds it by feel in the dark.`,
};

const lids = [], pullouts = [];
function buildWall(cfg) {
  lids.length = 0; pullouts.length = 0;
  const g = new THREE.Group();
  const V = CONFIG.features;
  const { width: W, depth: D, height: H, pilaster: PL, topRail: TR, skirting: SK, ledgeTop: LT, ledge: LG, walnutFrame: WF } = cfg;
  const x0 = PL, x1 = W - PL, iw = x1 - x0, lowerTop = LT - LG;
  const mirrorY0 = LT, mirrorY1 = cfg.mirror.top;

  // Dark painted frame: uprights, top rail and the 70 mm skirting round it
  for (const ux of [0, x1]) addUpright(g, cfg, ux, V);
  g.add(box(iw, TR, D, x0, H - TR, 0, mat.paint));
  g.add(box(W, SK, D + 1.2, 0, 0, 0, mat.paint));                   // skirting

  // Below the ledge: an open alcove for the bed, a storage well under lift-up lids, or the solid panel
  if (V.alcove) {
    g.add(box(iw, lowerTop - SK, 1, x0, SK, 0, mat.paint));           // the wall behind the bed, painted to match
    g.add(box(iw, LG, D, x0, lowerTop, 0, mat.paint));                // ledge spanning the uprights over the headboard
  } else if (V.tray) {
    addWell(g, cfg);
  } else {
    g.add(box(iw, lowerTop - SK, D, x0, SK, 0, mat.paint));           // lower panel, flush with the uprights
    g.add(box(iw, LG, D, x0, lowerTop, 0, mat.paint));                // ledge at the bottom of the mirror recess
  }

  // Mirror recess: dark back, the mirror itself, and a lip at the top front edge hiding the LED strip
  g.add(box(iw, mirrorY1 - mirrorY0, 2, x0, mirrorY0, 0, mat.paint));
  const mirror = mirrorPlane(iw - 1, mirrorY1 - mirrorY0 - 0.6);
  mirror.position.set((x0 + iw / 2) * M, ((mirrorY0 + mirrorY1) / 2) * M, 2.05 * M);
  g.add(mirror);
  const lip = cfg.led.lip;
  const lipMesh = box(iw, lip, 3, x0, mirrorY1 - lip, D - 3, mat.paint);
  lipMesh.userData.click = () => setLed(!state.ledOn);               // click the strip (or its lip) to switch it
  lipMesh.userData.tip = TIPS.mirrorLed();
  g.add(lipMesh);
  g.add(box(iw, 1, D - 3, x0, mirrorY1 - 1, 0, mat.paint));         // recess ceiling under the walnut rail
  const ledStrip = box(iw - 4, 0.5, 1.2, x0 + 2, mirrorY1 - lip - 0.5, D - 5.5, mat.ledStrip, { cast: false });
  ledStrip.userData.click = lipMesh.userData.click;
  ledStrip.userData.tip = lipMesh.userData.tip;
  g.add(ledStrip);
  g.userData.led = { x: x0 + iw / 2, y: mirrorY1 - lip - 0.6, z: D - 5, w: iw - 4 };

  // Upper cabinet: light carcass, dividers under the door joints, a shelf, and a walnut face frame
  const cy0 = mirrorY1, cy1 = H - TR, cd = D - cfg.doors.thickness;
  g.add(box(iw, cy1 - cy0, 2, x0, cy0, 0, mat.carcass));                          // back
  g.add(box(iw, WF, cd, x0, cy0, 0, mat.carcass));                                // floor
  g.add(box(iw, WF, cd, x0, cy1 - WF, 0, mat.carcass));                           // top
  g.add(box(WF, cy1 - cy0, cd, x0, cy0, 0, mat.carcass));                         // sides
  g.add(box(WF, cy1 - cy0, cd, x1 - WF, cy0, 0, mat.carcass));
  const ix0 = x0 + WF, ix1 = x1 - WF, n = cfg.doors.hinges.length, dw = (ix1 - ix0) / n;
  for (let i = 1; i < n; i++) g.add(box(1.8, cy1 - cy0 - 2 * WF, cd - 2, ix0 + i * dw - 0.9, cy0 + WF, 2, mat.carcass));
  for (let i = 0; i < n; i++) {
    const sx0 = ix0 + i * dw + (i ? 0.9 : 0), sx1 = ix0 + (i + 1) * dw - (i < n - 1 ? 0.9 : 0);
    g.add(box(sx1 - sx0, 1.8, cd - 3, sx0, cfg.shelf, 2, mat.carcass));
    addCabinetContents(g, sx0, sx1, cy0 + WF, cfg.shelf, cy1 - WF, 2, cd - 1, i);
  }
  // Walnut face frame round the doors (flush with the door fronts)
  const fz = D - cfg.doors.thickness;
  g.add(box(iw, WF, cfg.doors.thickness, x0, cy0, fz, mat.walnut));
  g.add(box(iw, WF, cfg.doors.thickness, x0, cy1 - WF, fz, mat.walnut));
  g.add(box(WF, cy1 - cy0, cfg.doors.thickness, x0, cy0, fz, mat.walnut));
  g.add(box(WF, cy1 - cy0, cfg.doors.thickness, x1 - WF, cy0, fz, mat.walnut));

  // Service hatch low on the right-hand upright: a fine groove and a push latch
  const h = cfg.hatch;
  g.add(box(h.w, 0.25, 0.1, h.x, h.y, D, mat.groove, { cast: false }));
  g.add(box(h.w, 0.25, 0.1, h.x, h.y + h.h, D, mat.groove, { cast: false }));
  g.add(box(0.25, h.h, 0.1, h.x, h.y, D, mat.groove, { cast: false }));
  g.add(box(0.25, h.h, 0.1, h.x + h.w, h.y, D, mat.groove, { cast: false }));

  // Table lamp on the ledge, its cable dropping through a grommet. Two models to choose from.
  const lp = cfg.lamp, ly = LT, lampGroup = new THREE.Group();
  if (CONFIG.interior.lamp === 'rondo') {
    // Innolux Rondo Air: a flat white disc, Ø 30 cm and 2.5 thick, leaning back about 12° on a small
    // foot at the rear; the whole face is the diffuser. 24 W, 4000 K, 2040 lm, not dimmable.
    const R = 15, th = 2.5, tilt = 0.21, cx = lp.x, cz = lp.z + 4;
    const disc = new THREE.Group();
    disc.position.set(cx * M, (ly + 1.2 + R * Math.cos(tilt)) * M, cz * M);
    disc.rotation.x = -tilt;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(R * M, R * M, th * M, 64), mat.rondo);
    body.rotation.x = Math.PI / 2; body.castShadow = true;
    const face = new THREE.Mesh(new THREE.CircleGeometry((R - 1.6) * M, 64), mat.rondoFace);
    face.position.z = (th / 2 + 0.05) * M;
    const rim = new THREE.Mesh(new THREE.RingGeometry((R - 1.6) * M, R * M, 64), mat.rondo);
    rim.position.z = (th / 2 + 0.03) * M;
    disc.add(body, face, rim);
    lampGroup.add(disc);
    const foot = box(7, 0.8, 9, cx - 3.5, ly, cz - 9.5, mat.rondo, { cast: false });    // flip-out foot behind
    const heel = box(7, 1.2, 1, cx - 3.5, ly, cz - 1.2, mat.rondo);                     // and the front edge it sits on
    lampGroup.add(foot, heel);
    lampGroup.userData.tip = TIPS.rondo();
    g.userData.lamp = { x: cx, y: ly + 1.2 + R * Math.cos(tilt), z: cz + 2, rondo: true, tilt };
  } else {
    lampGroup.add(placed(new THREE.CylinderGeometry(8 * M, 8.3 * M, 1.4 * M, 40), mat.brass, lp.x, ly + 0.7, lp.z));
    lampGroup.add(placed(new THREE.CylinderGeometry(0.8 * M, 0.8 * M, 19 * M, 16), mat.brass, lp.x, ly + 1.4 + 9.5, lp.z));
    const dome = placed(new THREE.SphereGeometry(8 * M, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), mat.brass, lp.x, ly + 20, lp.z);
    lampGroup.add(dome);
    const bulb = placed(new THREE.SphereGeometry(3 * M, 20, 12), mat.bulb, lp.x, ly + 20.5, lp.z);
    bulb.castShadow = false;
    lampGroup.add(bulb);
    lampGroup.userData.tip = TIPS.lamp();
    g.userData.lamp = { x: lp.x, y: ly + 21, z: lp.z };
  }
  lampGroup.userData.click = () => setLamp(!state.lampOn);
  g.add(lampGroup);
  const gx = lp.x + 11, gz = lp.z - 4;
  g.add(placed(new THREE.CylinderGeometry(2.4 * M, 2.4 * M, 0.3 * M, 28), mat.groove, gx, ly + 0.1, gz));
  const grommet = placed(new THREE.TorusGeometry(2.4 * M, 0.4 * M, 8, 32), mat.brass, gx, ly + 0.2, gz);
  grommet.rotation.x = Math.PI / 2;
  g.add(grommet);
  const curve = new THREE.CatmullRomCurve3([[lp.x + 7, ly + 0.6, lp.z - 1], [lp.x + 9.5, ly + 0.5, gz + 0.5], [gx, ly + 0.3, gz], [gx, ly - 2, gz]]
    .map(p => new THREE.Vector3(...p).multiplyScalar(M)));
  const cable = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.3 * M, 8), mat.black);
  g.add(cable);

  return g;
}

// One dark upright. Plain, or with open bedside niches in its front, or with its lower part
// made into a pull-out unit (the fixed part above the ledge stays).
function addUpright(g, cfg, ux, V) {
  const { depth: D, height: H, pilaster: PL, skirting: SK, ledgeTop: LT, ledge: LG } = cfg;
  const lowerTop = LT - LG;
  if (V.pullouts) {
    g.add(box(PL, H - lowerTop, D, ux, lowerTop, 0, mat.paint));
    g.add(box(PL, lowerTop - SK, 1, ux, SK, 0, mat.paint));                        // back of the cavity
    for (const x of [ux + 0.3, ux + PL - 1.1]) g.add(box(0.8, 1, D - 3, x, SK, 1, mat.chrome, { cast: false }));   // runners
    addPullout(g, cfg, ux, SK + 1, lowerTop - 0.4);
    return;
  }
  if (V.niches) {
    const n = cfg.niches, cheek = (PL - n.w) / 2;
    let y = SK;
    for (const slot of [...n.slots, { y: H, h: 0 }]) {
      const y0 = slot.y, y1 = slot.y + slot.h;
      if (y0 > y) g.add(box(PL, y0 - y, D, ux, y, 0, mat.paint));
      if (y1 > y0) {
        const ng = new THREE.Group();                                                 // the niche and what's in it share one note
        ng.userData.tip = TIPS[slot.holds]?.(slot, n);
        ng.add(box(PL, y1 - y0, D - n.d, ux, y0, 0, mat.paint));                      // back of the niche
        ng.add(box(cheek, y1 - y0, n.d, ux, y0, D - n.d, mat.paint));                 // cheeks
        ng.add(box(cheek, y1 - y0, n.d, ux + PL - cheek, y0, D - n.d, mat.paint));
        addNicheContents(ng, ux + cheek, y0, D - n.d, n.w, y1 - y0, n.d, slot.holds, ux === 0);
        g.add(ng);
        if (slot.outlets) {                                                           // flush plate on the upright's face, just under this niche
          const og = new THREE.Group();
          og.userData.tip = TIPS.nicheOutlets(slot.outlets);
          addFacePlate(og, ux + PL / 2, y0 - 2, D, slot.outlets);
          g.add(og);
        }
      }
      y = y1;
    }
    return;
  }
  g.add(box(PL, H - SK, D, ux, SK, 0, mat.paint));
}

// What the niches hold: a phone on a charging pad with a USB-C outlet behind it, a pair of reading
// glasses, or a 0.5 l soda bottle. Interior is x..x+w, y..y+h, z..z+d (front at z+d).
function addNicheContents(g, x, y, z, w, h, d, holds, left) {
  const cx = x + w / 2, front = z + d;
  if (holds === 'phone') {
    // Wireless charging pad let into the niche floor, the phone lying on it; no cable or socket to see
    const pad = placed(new THREE.CylinderGeometry(4.2 * M, 4.2 * M, 0.5 * M, 32), mat.black, cx, y + 0.25, front - 9.5);   // pad, 2 mm proud
    pad.userData.tip = TIPS.pad();
    g.add(pad);
    g.add(placed(new THREE.TorusGeometry(3.6 * M, 0.12 * M, 6, 32), clothMat(0x7c7c80), cx, y + 0.52, front - 9.5).rotateX(Math.PI / 2));   // ring marking the coil
    g.add(rbox(7, 0.8, 14.5, cx - 3.5, y + 0.5, front - 16.5, mat.screen, 0.5));                                           // phone, face up
  } else if (holds === 'glasses') {
    // Folded reading glasses lying along the niche: the two lenses in a line front to back, arms folded alongside
    const frameMat = mat.black, lens = mat.glass, gz = front - 9;
    for (const dz of [-2.4, 2.4]) {
      g.add(placed(new THREE.TorusGeometry(2.1 * M, 0.18 * M, 8, 28), frameMat, cx + 1.2, y + 0.6, gz + dz).rotateX(Math.PI / 2));
      g.add(placed(new THREE.CylinderGeometry(2 * M, 2 * M, 0.15 * M, 28), lens, cx + 1.2, y + 0.6, gz + dz));
    }
    g.add(box(0.3, 0.3, 1.2, cx + 1.05, y + 0.6, gz - 0.6, frameMat));                                                     // bridge
    g.add(box(0.3, 0.3, 11, cx - 1.4, y + 0.8, gz - 5.5, frameMat));                                                       // folded arms
    g.add(box(0.3, 0.3, 11, cx - 1.8, y + 1.1, gz - 5.5, frameMat));
  } else if (holds === 'bottle') {
    // A clear 0.5 l bottle, half full, with a white cap and no label: a smooth lathe profile (radius, height)
    const lathe = (pts, material) => new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, yy]) => new THREE.Vector2(r * M, yy * M)), 48), material);
    const pet = new THREE.MeshStandardMaterial({ color: 0xf2f5f3, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.32, side: THREE.DoubleSide });
    const water = new THREE.MeshStandardMaterial({ color: 0xe6eeea, roughness: 0.1, transparent: true, opacity: 0.45 });
    const shell = lathe([[0, 0], [2.6, 0], [3.2, 0.5], [3.25, 3], [3.1, 4], [3.25, 5], [3.25, 15.5], [3.0, 18], [2.2, 20], [1.5, 21.5], [1.5, 23.2], [1.4, 23.2]], pet);
    shell.position.set(cx * M, y * M, (front - 10) * M); shell.castShadow = true;
    g.add(shell);
    const fill = lathe([[0, 0.3], [3.0, 0.3], [3.0, 12.5], [0, 12.5]], water);
    fill.position.copy(shell.position);
    g.add(fill);
    g.add(placed(new THREE.CylinderGeometry(1.65 * M, 1.65 * M, 1.8 * M, 24), clothMat(0xf4f4f2), cx, y + 23.6, front - 10));   // cap
    g.add(placed(new THREE.TorusGeometry(1.6 * M, 0.12 * M, 6, 24), clothMat(0xe6e6e2), cx, y + 22.5, front - 10).rotateX(Math.PI / 2));   // tamper ring
  }
}

// Tall pull-out bedside unit: a dark front flush with the upright, a brass pull, and a narrow
// carcass of lipped shelves open on both sides. It slides out of the upright on runners.
function addPullout(g, cfg, ux, y0, y1) {
  const { depth: D, pilaster: PL } = cfg, pu = cfg.pullouts, h = y1 - y0;
  const u = new THREE.Group();
  u.add(box(PL - 0.6, h, 2, ux + 0.3, y0, D - 2, mat.paint));                            // front
  const bar = placed(new THREE.CylinderGeometry(0.6 * M, 0.6 * M, 22 * M, 16), mat.brass, ux + PL / 2, y0 + h * 0.55, D + 1.8);
  u.add(bar);
  for (const dy of [-9, 9]) u.add(placed(new THREE.CylinderGeometry(0.4 * M, 0.4 * M, 1.8 * M, 12), mat.brass, ux + PL / 2, y0 + h * 0.55 + dy, D + 0.9).rotateX(Math.PI / 2));
  const cw = PL - 2, cz = 2, cd = D - 2 - cz - 0.5;
  u.add(box(cw, h - 1, 1.2, ux + 1, y0 + 0.5, cz, mat.carcass));                          // back
  for (const sy of [0.5, ...pu.shelves]) {
    u.add(box(cw, 1.5, cd, ux + 1, y0 + sy, cz, mat.carcass));
    for (const x of [ux + 1, ux + PL - 1.6]) u.add(box(0.6, 4, cd, x, y0 + sy + 1.5, cz, mat.carcass));   // lips
  }
  // Contents: bottle and glasses case at the bottom, books, then phone and candle, earbuds on top
  const cx = ux + PL / 2, zc = cz + cd / 2, base = y0 + 2;
  u.add(placed(new THREE.CylinderGeometry(3.2 * M, 3.2 * M, 22 * M, 20), clothMat(0x8fb0c9), cx, base + 11, zc - 4));
  u.add(rbox(6, 3.5, 15, cx - 3, base, zc + 1, clothMat(0x3b3b40), 1));
  const s1 = y0 + pu.shelves[0] + 1.5;
  [0x7a3b2e, 0x2f4a5c, 0x3c4a3a].forEach((c, i) => u.add(box(9.5, 2.2, 15 - i, cx - 4.75, s1 + i * 2.2, zc - 7, clothMat(c))));
  const s2 = y0 + pu.shelves[1] + 1.5;
  u.add(rbox(7, 0.8, 14.5, cx - 3.5, s2, zc - 7, mat.screen, 0.5));
  u.add(placed(new THREE.CylinderGeometry(2.4 * M, 2.4 * M, 7 * M, 20), mat.wax, cx, s2 + 3.5, zc + 5));
  const s3 = y0 + pu.shelves[2] + 1.5;
  u.add(rbox(5.5, 2.5, 5.5, cx - 2.75, s3, zc - 2, clothMat(0xf2f0ea), 1.5));
  u.userData = { pullout: true, travel: pu.travel, open: 0, target: 0, click: () => togglePiece(u), tip: TIPS.pullout() };
  pullouts.push(u);
  g.add(u);
}

// Storage tray behind the headboard: a lined compartment `lids.depth` deep under the ledge, which is
// a fixed section round the lamp plus lift-up lids hinged just in front of the mirror. Solid below.
function addWell(g, cfg) {
  const { width: W, depth: D, pilaster: PL, skirting: SK, ledgeTop: LT, ledge: LG } = cfg;
  const x0 = PL, iw = W - 2 * PL, lowerTop = LT - LG, li = cfg.lids, t = 2;
  const wd = Math.min(li.depth, lowerTop - SK - t), wy = lowerTop - wd;        // tray depth and floor level
  g.add(box(iw, lowerTop - SK, t, x0, SK, D - t, mat.paint));                 // front, behind the headboard
  if (wy - t > SK) g.add(box(iw, wy - t - SK, D - t, x0, SK, 0, mat.paint));   // solid below the tray
  const [f0, f1] = li.fixed;
  // The tray runs under the lids only. Under the lamp's fixed section is a closed compartment for the
  // electrics; its wall towards the tray carries the power plate.
  const tx0 = f1 + 0.8, tw = W - PL - tx0;                                    // tray interior starts past the partition
  g.add(box(tx0 - 0.8 - x0, wd, D - t, x0, wy, 0, mat.paint));                // the compartment, solid from outside, up to the back of the partition
  g.add(box(tw, t, D - t, tx0, wy - t, 0, mat.carcass));                      // tray floor, stopping behind the front panel
  g.add(box(tw, wd, 1, tx0, wy, 0, mat.carcass));                             // back lining
  for (const x of [tx0 - 0.8, W - PL - 0.8]) g.add(box(0.8, wd, D - t - 1, x, wy, 1, mat.carcass));   // partition and right end
  g.add(box(f1 - f0, LG, D, f0, lowerTop, 0, mat.paint));
  const edges = [f1, ...li.split, W - PL];
  const hz = 2.6;                                                              // hinge line, just in front of the mirror
  g.add(box(W - PL - f1, LG, hz, f1, lowerTop, 0, mat.paint));                 // fixed rail the lids hinge on
  for (let i = 0; i + 1 < edges.length; i++) {
    const a = edges[i] + 0.3, w = edges[i + 1] - 0.3 - a;
    const pivot = new THREE.Group();
    pivot.position.set(a * M, lowerTop * M, hz * M);
    pivot.add(box(w, LG, D - hz, 0, 0, 0, mat.paint));
    pivot.add(box(10, 0.8, 1.5, w / 2 - 5, LG - 0.8, D - hz - 2.5, mat.groove, { cast: false }));   // finger groove
    pivot.userData = { max: 1.4, open: 0, target: 0, click: () => togglePiece(pivot), tip: TIPS.lid() };   // opens to about 80°, held by a stay so it never touches the mirror
    lids.push(pivot);
    g.add(pivot);
  }
  const tray = new THREE.Group();
  tray.userData.tip = TIPS.tray(tw - 1, wd, D - t - 1);
  addWellContents(tray, tx0 + 1, wy, 1, tw - 1, wd, D - t - 1);
  g.add(tray);
  // Power: a plate on the partition at the lamp end, facing into the tray, fed from the compartment behind it
  const power = new THREE.Group();
  power.userData.tip = TIPS.trayPower();
  addTrayPower(power, tx0 - 0.5, wy + 4, 2, 'x');                           // let 5 mm into the partition so it doesn't fight its face
  g.add(power);
  // LED strip along the back of the tray, under the hinge rail, switched by a sensor when a lid lifts
  const trayStrip = box(tw - 4, 0.5, 1.2, tx0 + 2, lowerTop - 1.4, 1.2, mat.trayLedStrip, { cast: false });
  trayStrip.userData.tip = TIPS.trayLed();
  g.add(trayStrip);
  g.userData.trayLed = { x: tx0 + tw / 2, y: lowerTop - 1.5, z: 1.8, w: tw - 4 };
  g.userData.trayWidth = tw - 1;
}

// Flush vertical plate in the front of an upright, Schneider Exxact style in anthracite: USB-C
// ports on top, Schuko socket(s) below. cx is the plate's centre across, yTop its top edge, z the
// face it sits on (facing the room).
function addFacePlate(g, cx, yTop, z, { sockets = 1, usbc = 2 }) {
  const pw = 8, ph = 2 + (usbc ? 4 : 0) + sockets * 7, x0 = cx - pw / 2, y0 = yTop - ph;
  g.add(rbox(pw, ph, 0.6, x0, y0, z - 0.3, mat.anthracite, 0.3));
  const disc = (r, cy, material, dz = 0.32) => g.add(placed(new THREE.CylinderGeometry(r * M, r * M, 0.04 * M, 28), material, cx, cy, z + dz).rotateX(Math.PI / 2));
  let y = yTop - 1;
  if (usbc) {
    const gap = pw / (usbc + 1);
    for (let i = 0; i < usbc; i++) {
      const px = x0 + gap * (i + 1);
      g.add(rbox(1.4, 2.4, 0.06, px - 0.7, y - 3.2, z + 0.3, mat.anthraciteDeep, 0.03));
      g.add(rbox(0.85, 0.3, 0.06, px - 0.425, y - 2.15, z + 0.33, mat.screen, 0.03));
    }
    y -= 4;
  }
  for (let i = 0; i < sockets; i++, y -= 7) {
    disc(2.9, y - 3.5, mat.anthraciteDeep); disc(2.3, y - 3.5, mat.screen, 0.34);
    for (const dx of [-0.95, 0.95]) g.add(placed(new THREE.CylinderGeometry(0.25 * M, 0.25 * M, 0.04 * M, 12), mat.anthracite, cx + dx, y - 3.5, z + 0.36).rotateX(Math.PI / 2));
  }
}

// Flush power plate with Schuko socket faces and USB-C slots. `face` 'z' mounts it on a wall at z
// facing +z (spanning x from x); 'x' mounts it on a wall at x facing +x (spanning z from z).
function addTrayPower(g, x, y, z, face = 'z') {
  const pw = 22, ph = 8, along = face === 'z';
  const grp = new THREE.Group();                       // built facing +z, then turned if it faces +x
  grp.add(rbox(pw, ph, 1, 0, 0, 0, mat.carcass, 0.3));
  const disc = (r, cx, cy, material, dz = 1.02) =>
    grp.add(placed(new THREE.CylinderGeometry(r * M, r * M, 0.04 * M, 28), material, cx, cy, dz).rotateX(Math.PI / 2));
  for (const cx of [4.5, 11.5]) {                      // two Schuko sockets
    disc(2.9, cx, ph / 2, mat.black);
    disc(2.3, cx, ph / 2, mat.screen, 1.04);
    for (const dx of [-0.95, 0.95]) disc(0.25, cx + dx, ph / 2, mat.carcass, 1.06);
  }
  for (const cx of [17, 20]) {                         // two USB-C ports
    grp.add(rbox(1.4, 2.4, 0.06, cx - 0.7, ph / 2 - 1.2, 1.0, mat.black, 0.03));
    grp.add(rbox(0.85, 0.3, 0.06, cx - 0.425, ph / 2 - 0.15, 1.03, mat.screen, 0.03));
  }
  if (along) grp.position.set(x * M, y * M, z * M);
  else { grp.rotation.y = Math.PI / 2; grp.position.set(x * M, y * M, (z + pw) * M); }
  g.add(grp);
}

// Bedside clutter that suits a shallow tray: a tablet, books, tissues, a glasses case, a notebook,
// a charger with its cable coiled, a remote. If the tray is deep, taller things stand on edge instead.
function addWellContents(g, x, y, z, w, h, d) {
  const zc = z + d / 2;
  if (h > 40) {
    for (const [dx, dz] of [[2, 1], [2, 11], [76, 1]]) g.add(rbox(70, Math.min(84, h - 4), 8.5, x + dx, y + 0.5, z + dz, mat.bag, 3));
    g.add(rbox(44, Math.min(62, h - 4), 12, x + 78, y + 0.5, z + 10.5, mat.pillow, 5));
    return;
  }
  g.add(rbox(25, 0.7, 17, x + 4, y, zc - 8.5, mat.screen, 0.5));                                        // tablet
  [0x7a3b2e, 0x2f4a5c, 0x9c7b4a].forEach((c, i) => g.add(box(21 - i, 2.2, 14, x + 34, y + i * 2.2, zc - 7, clothMat(c))));   // books
  g.add(rbox(22, 8, 11, x + 62, y, zc - 5.5, clothMat(0xf2efe8), 1));                                   // tissue box
  g.add(rbox(16, 3.5, 6.5, x + 90, y, zc - 3, clothMat(0x3b3b40), 1.2));                                // glasses case
  g.add(rbox(15, 1.5, 21, x + 90, y, zc - 10.5 + 7, clothMat(0x6e8fa8), 0.4).translateX(0.2 * M));      // notebook
  g.add(placed(new THREE.CylinderGeometry(0.35 * M, 0.35 * M, 14 * M, 8), clothMat(0x2f2f33), x + 108, y + 0.4, zc + 2).rotateX(Math.PI / 2));   // pen
  g.add(rbox(4, 2.8, 4, x + 115, y, zc - 2, clothMat(0xf4f4f2), 0.6));                                  // charger
  const coil = [];
  for (let a = 0; a <= Math.PI * 2 * 2.5; a += 0.3) coil.push([x + 128 + 5 * Math.cos(a), y + 0.4 + a * 0.06, zc + 4 * Math.sin(a)]);
  const curve = new THREE.CatmullRomCurve3(coil.map(p => new THREE.Vector3(...p).multiplyScalar(M)));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.22 * M, 8), clothMat(0xf4f4f2)));
  g.add(rbox(4.5, 1.6, 16, x + w - 12, y, zc - 8, mat.screen, 0.6));                                    // remote
}

// Folded bedding below the shelf, storage boxes above it, in each compartment of the upper cabinet.
function addCabinetContents(g, sx0, sx1, y0, shelfY, y1, z0, z1, i) {
  const rand = mulberry32(40 + i), w = sx1 - sx0;
  const stackCols = [0xcfc6b8, 0xe6e1d8, 0xb9b0a3, 0x9ea4a8, 0xd9d3c8, 0xa89f93];
  let yy = y0;
  const layers = 5 + Math.floor(rand() * 3);
  for (let l = 0; l < layers && yy + 5 < shelfY; l++) {
    const sw = w - 8 - rand() * 6, sd = z1 - z0 - 4 - rand() * 3, sh = 3.5 + rand() * 1.5;
    g.add(rbox(sw, sh, sd, sx0 + (w - sw) / 2 + (rand() - 0.5) * 2, yy, z0 + 2 + (rand() - 0.5) * 1.5, clothMat(stackCols[Math.floor(rand() * stackCols.length)]), 1.2));
    yy += sh;
  }
  const bw = (w - 6) / 2, bh = Math.min(26, y1 - shelfY - 1.8 - 3), bd = z1 - z0 - 3;
  for (let k = 0; k < 2; k++) {
    const bx = sx0 + 2 + k * (bw + 2);
    g.add(rbox(bw, bh, bd, bx, shelfY + 1.8, z0 + 1.5, mat.box, 1.2));
    g.add(rbox(6, 2, 0.4, bx + bw / 2 - 3, shelfY + 1.8 + bh - 6, z0 + 1.5 + bd, mat.groove, 0.15));
  }
}

// Three walnut doors on the upper cabinet, each hinged on the side named in CONFIG, with a small brass knob.
function buildDoors(cfg) {
  const g = new THREE.Group();
  const { width: W, depth: D, pilaster: PL, walnutFrame: WF, doors } = cfg;
  const ix0 = PL + WF, ix1 = W - PL - WF, n = doors.hinges.length, dw = (ix1 - ix0) / n, gap = 0.3, th = doors.thickness;
  const y0 = doors.bottom + gap, h = doors.top - doors.bottom - 2 * gap;
  doors.hinges.forEach((side, i) => {
    const x0 = ix0 + i * dw + gap / 2, x1 = ix0 + (i + 1) * dw - gap / 2, w = x1 - x0, left = side === 'left';
    const pivot = new THREE.Group();
    pivot.position.set((left ? x0 : x1) * M, 0, D * M);
    pivot.add(box(w, h, th, left ? 0 : -w, y0, -th, mat.walnut));
    // Inlay stringing: a thin pale line let into the face, inset from the door edges
    const ins = doors.inlay, lw = 0.4, ix = (left ? 0 : -w) + ins, iwd = w - 2 * ins, ih = h - 2 * ins, iy = y0 + ins;
    for (const [bw, bh, bx, by] of [[iwd, lw, ix, iy], [iwd, lw, ix, iy + ih - lw], [lw, ih, ix, iy], [lw, ih, ix + iwd - lw, iy]])
      pivot.add(box(bw, bh, 0.06, bx, by, 0, mat.inlay, { cast: false }));
    const kx = left ? w - ins - 5.5 : -(w - ins - 5.5);                    // knob inside the inlay line, 5.5 cm in from it
    const knob = placed(new THREE.CylinderGeometry(1.2 * M, 1.0 * M, 1.6 * M, 20), mat.brass, kx, doors.knobY, 0.8);
    knob.rotation.x = Math.PI / 2;
    pivot.add(knob);
    pivot.add(placed(new THREE.CylinderGeometry(0.5 * M, 0.5 * M, 0.8 * M, 12), mat.brass, kx, doors.knobY, 0.3).rotateX(Math.PI / 2));
    pivot.userData = { sign: left ? -1 : 1, max: 1.75, open: 0, target: 0, click: () => togglePiece(pivot) };
    g.add(pivot);
  });
  return g;
}

// ---------------------------------------------------------------------------
// Bed: continental base in gingham on short tapered legs, a cream topper, upholstered headboard, pillows
// ---------------------------------------------------------------------------
function buildBed(cfg, wall) {
  const g = new THREE.Group();
  bedDrawers.length = 0;
  const hb = cfg.headboard, { width: Wd, length: L } = cfg;
  const back = CONFIG.features.alcove ? 0 : wall.depth;            // the headboard sits against this
  const x0 = wall.pilaster + (wall.width - 2 * wall.pilaster - Wd) / 2, z0 = back + hb.thickness + 1;
  g.add(rbox(hb.width, hb.top - hb.bottom, hb.thickness, wall.pilaster + (wall.width - 2 * wall.pilaster - hb.width) / 2, hb.bottom, back + 0.5, mat.fabric, 2.5));
  if (cfg.frame) {
    addBedFrame(g, cfg, x0, z0, wall.depth, wall.pilaster + (wall.width - 2 * wall.pilaster - hb.width) / 2, CONFIG.features.alcove);
  } else {
    for (const [dx, dz] of [[8, 8], [Wd - 8, 8], [8, L - 8], [Wd - 8, L - 8]])
      g.add(placed(new THREE.CylinderGeometry(2.2 * M, 3 * M, cfg.legs * M, 16), mat.leg, x0 + dx, cfg.legs / 2, z0 + dz));
    g.add(patternedBox(Wd, cfg.baseTop - cfg.legs, L, x0, cfg.legs, z0, ginghamMat));
    g.add(rbox(Wd - 2, cfg.topperTop - cfg.baseTop, L - 2, x0 + 1, cfg.baseTop, z0 + 1, mat.topper, 2.5));
  }
  g.userData.foot = cfg.frame ? wall.depth + g.userData.frameLength : z0 + L;
  // Pillows, two styles: big 60 x 80 ones (Familon Superior size), two per side, the back one
  // leaning on the headboard and the front one slouched against it, hotel style; or the small
  // flat ones from the first drafts, one per side.
  if (state.pillows === 'small') {
    const spw = (Wd - 10 - (cfg.pillows - 1) * 6) / cfg.pillows, sph = 26, spd = 13;
    for (let i = 0; i < cfg.pillows; i++) {
      const sp = rbox(spw, sph, spd, 0, 0, 0, mat.pillow, 5);
      sp.position.set((x0 + 5 + i * (spw + 6) + spw / 2) * M, (cfg.topperTop + sph / 2 - 1) * M, (z0 + spd / 2 + 1) * M);
      sp.rotation.x = -0.18;
      g.add(sp);
    }
    return g;
  }
  const pw = Math.min(80, (Wd - 8 - (cfg.pillows - 1) * 4) / cfg.pillows), ph = 60;
  for (let i = 0; i < cfg.pillows; i++) {
    const cx = x0 + Wd / 2 + (i - (cfg.pillows - 1) / 2) * (pw + 4);
    const back = pillow(pw, ph, 20, 11 + i);
    back.position.set(cx * M, (cfg.topperTop + ph / 2 - 5) * M, (z0 + 13) * M);
    back.rotation.x = -0.3;
    back.rotation.z = (i ? 1 : -1) * 0.02;
    const front = pillow(pw, ph, 18, 21 + i);
    front.position.set(cx * M, (cfg.topperTop + ph / 2 - 12) * M, (z0 + 30) * M);
    front.rotation.x = -0.7;
    front.rotation.z = (i ? -1 : 1) * 0.04;
    g.add(back, front);
  }
  return g;
}

// Low platform frame round the mattress, in the style of IKEA's MALM storage bed: 8 cm rails,
// the mattress sitting inside, and drawers in the lower band of the rails that slide out sideways.
// The frame starts at the dark box's front. With the headboard in front of the box its side rails
// pass the headboard and the head rail drops to a low piece under it; with the bed in the alcove
// the uprights are the head end, the frame is U-shaped and the mattress carries on into the alcove
// over a base extension. Drawers are listed per side ('left' slides out towards the door, 'foot'
// towards the room); each is [offset along that side, width], squeezed to fit a shorter frame.
// No drawers on the right, which is 7 cm from the wall.
const bedDrawers = [];
function addBedFrame(g, cfg, x0, z0, frameStart, hbx0, alcove) {
  const f = cfg.frame, { width: Wd, length: L } = cfg, hb = cfg.headboard, side = f.side, dh = f.drawers.height, dz = f.drawers.depth;
  const sideR = f.sideRight ?? side, fx0 = x0 - side, fz0 = frameStart, fw = Wd + side + sideR, lo = 2, rh = f.height - lo;   // rails stand on 2 cm feet
  const fl = z0 + L + side - fz0;                                                    // to the far side of the foot rail
  g.userData.frameLength = fl;
  const rail = (w, h, d, x, y, z) => g.add(box(w, h, d, x, y, z, mat.walnut));
  const hbx1 = hbx0 + hb.width;
  if (!alcove) {
    rail(hbx0 - fx0, rh, side, fx0, lo, fz0);                                         // head rail beside the headboard
    rail(fx0 + fw - hbx1, rh, side, hbx1, lo, fz0);
    rail(hbx1 - hbx0, hb.bottom - lo - 0.5, side, hbx0, lo, fz0);                     // and low under it
  } else {
    g.add(box(Wd, 2, fz0 + side - z0, x0, f.height - 3, z0, mat.carcass));           // base extension into the alcove
  }
  rail(sideR, rh, fl - 2 * side, fx0 + fw - sideR, lo, fz0 + side);                   // right rail, solid, wide enough to meet the wall
  // Left and foot rails are solid between the drawer openings; the drawer fronts fill the openings full height
  const segs = { left: [], foot: [] };
  const room = { left: fl - side - 2, foot: fw - 2 };                                 // length available for drawer fronts on each side
  for (const s of ['left', 'foot']) {
    const list = f.drawers[s] ?? [], end = Math.max(0, ...list.map(([o, w]) => o + w)), k = end > room[s] ? room[s] / end : 1;
    for (const [o, w] of list) segs[s].push([o * k, (o + w) * k]);
  }
  const fill = (s, len, draw) => {
    let a = 0;
    for (const [b0, b1] of segs[s].sort((p, q) => p[0] - q[0])) { if (b0 - 0.4 > a) draw(a, b0 - 0.4); a = b1 + 0.4; }
    if (len > a) draw(a, len);
  };
  fill('left', fl, (a, b) => rail(side, rh, b - a, fx0, lo, fz0 + a));
  fill('foot', fw, (a, b) => rail(b - a, rh, side, fx0 + a, lo, fz0 + fl - side));
  // Thin plates behind the gaps at each end of a drawer front, so the gaps show dark carcass, not the tray
  for (const [b0, b1] of segs.left) for (const z of [b0 - 0.4, b1 - 0.6]) rail(side - 2.3, rh, 1, fx0 + 2.3, lo, fz0 + z);
  for (const [b0, b1] of segs.foot) for (const x of [b0 - 0.4, b1 - 0.6]) rail(1, rh, side - 2.3, fx0 + x, lo, fz0 + fl - side);
  // Behind the drawer fronts the rail is solid above the trays for its whole length, so the frame is
  // closed from above and the mattress base is carried all round; the trays slide underneath it
  rail(side - 2.3, rh - dh - 1.6, fl, fx0 + 2.3, lo + dh + 1.5, fz0);
  rail(fw, rh - dh - 1.6, side - 2.3, fx0, lo + dh + 1.5, fz0 + fl - side);
  for (const [x, z] of [[fx0 + 2, fz0 + 2], [fx0 + fw - 6, fz0 + 2], [fx0 + 2, fz0 + fl - 6], [fx0 + fw - 6, fz0 + fl - 6]])
    g.add(box(4, lo, 4, x, 0, z, mat.leg));                                           // feet
  // Base board carrying the mattress, closing the frame over the drawers; the mattress on it, its top at topperTop
  g.add(box(fw - side - sideR + 1, 2, fl - 2 * side, fx0 + side - 0.5, f.height - 3, fz0 + side, mat.carcass));
  g.add(rbox(Wd, cfg.topperTop - (f.height - 1), L, x0, f.height - 1, z0, mat.topper, 3));
  // Drawers: an open box on runners behind a flush front, folded clothes inside
  const rand = mulberry32(61);
  const drawer = (s, o, w) => {
    const d = new THREE.Group();
    const left = s === 'left';
    // Full-height front, as tall as the rail, with the 15 cm tray behind its lower part
    const front = left ? box(2, rh - 0.6, w, fx0 + 0.3, lo + 0.3, fz0 + o, mat.walnut) : box(w, rh - 0.6, 2, fx0 + o, lo + 0.3, fz0 + fl - 2.3, mat.walnut);
    d.add(front);
    const bx = left ? fx0 + 2.3 : fx0 + o + 1, bz = left ? fz0 + o + 1 : fz0 + fl - 2.3 - dz, bw = left ? dz : w - 2, bd = left ? w - 2 : dz;
    d.add(box(bw, 1.2, bd, bx, lo + 0.5, bz, mat.carcass));
    d.add(box(1.2, dh - 3, bd, bx, lo + 0.5, bz, mat.carcass));
    d.add(box(1.2, dh - 3, bd, bx + bw - 1.2, lo + 0.5, bz, mat.carcass));
    d.add(box(bw, dh - 3, 1.2, bx, lo + 0.5, left ? bz + bd - 1.2 : bz, mat.carcass));
    d.add(box(bw, dh - 3, 1.2, bx, lo + 0.5, left ? bz : bz + bd - 1.2, mat.carcass));
    const n = Math.floor((left ? bd : bw) / 30);                                      // stacks of folded clothes
    for (let i = 0; i < n; i++) {
      let yy = lo + 1.7;
      const cx = (left ? bx + 16 : bx + 15 + i * ((bw - 4) / n)), cz = (left ? bz + 15 + i * ((bd - 4) / n) : bz + bd - 16);
      for (let k = 0; k < 3; k++) {
        const sw = 24 + rand() * 4, sd = 26 + rand() * 4, sh = 3 + rand();
        g; d.add(rbox(sw, sh, sd, cx - sw / 2, yy, cz - sd / 2, clothMat([0x6b5a3c, 0x7d8590, 0xb7bcc2, 0x8c6f63, 0xa7a29a, 0x3f4a5c][Math.floor(rand() * 6)]), 1));
        yy += sh;
      }
    }
    d.userData = { axis: left ? 'x' : 'z', sign: left ? -1 : 1, travel: f.drawers.travel, open: 0, target: 0, click: () => togglePiece(d) };
    bedDrawers.push(d);
    g.add(d);
  };
  for (const s of ['left', 'foot']) for (const [a, b] of segs[s]) drawer(s, a, b - a);
}

const lineMat = new THREE.LineBasicMaterial({ color: 0x1a1a1a });
function dimension(a, b, text, tickDir, soft = false) {
  const g = new THREE.Group();
  const A = new THREE.Vector3(...a).multiplyScalar(M), Bv = new THREE.Vector3(...b).multiplyScalar(M);
  const t = new THREE.Vector3(...tickDir).multiplyScalar(2.5 * M);
  const pts = [A, Bv, A.clone().add(t), A.clone().sub(t), Bv.clone().add(t), Bv.clone().sub(t)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setIndex([0, 1, 2, 3, 4, 5]);
  g.add(new THREE.LineSegments(geo, lineMat));
  const el = document.createElement('div');
  el.className = soft ? 'dim soft' : 'dim';
  el.textContent = text;
  const label = new CSS2DObject(el);
  label.position.copy(A).lerp(Bv, 0.5);
  g.add(label);
  return g;
}
const fmt = v => `${Math.round(v * 10) / 10}`;

function buildDimensions() {
  const g = new THREE.Group();
  const c = EFF.wall, { width: W, depth: D, height: H, pilaster: PL } = c;
  const d = CONFIG.room.door;
  g.add(dimension([0, H - 4, D + 4], [W, H - 4, D + 4], `${fmt(W)} cm`, [0, 1, 0]));
  g.add(dimension([W - 5, 0, D + 8], [W - 5, H, D + 8], `${fmt(H)} cm`, [1, 0, 0]));
  g.add(dimension([PL + 2, c.ledgeTop + 1, 2], [PL + 2, c.ledgeTop + 1, D], `${fmt(D)} cm`, [0, 1, 0]));
  g.add(dimension([PL, c.ledgeTop + 1.5, D - 1], [W - PL, c.ledgeTop + 1.5, D - 1], `recess ${fmt(W - 2 * PL)}`, [0, 1, 0], true));
  g.add(dimension([PL + 8, c.ledgeTop, D - 2], [PL + 8, c.mirror.top, D - 2], `mirror ${fmt(c.mirror.top - c.ledgeTop)}`, [1, 0, 0], true));
  const dw = (W - 2 * (PL + c.walnutFrame)) / c.doors.hinges.length;
  g.add(dimension([PL + c.walnutFrame, c.doors.top + 1.5, D + 2], [PL + c.walnutFrame + dw, c.doors.top + 1.5, D + 2], `door ${fmt(dw)}`, [0, 1, 0], true));
  g.add(dimension([W - PL - 6, c.doors.bottom, D + 3], [W - PL - 6, c.doors.top, D + 3], `${fmt(c.doors.top - c.doors.bottom)}`, [1, 0, 0], true));
  const bx = PL + (W - 2 * PL - EFF.bed.width) / 2;
  g.add(dimension([bx, EFF.bed.topperTop + 2, 130], [bx + EFF.bed.width, EFF.bed.topperTop + 2, 130], `bed ${fmt(EFF.bed.width)}`, [0, 1, 0], true));
  g.add(dimension([d.x0, 120, 2], [d.x1, 120, 2], `opening ${fmt(d.x1 - d.x0)}`, [0, 1, 0], true));
  // Uprights: outer width of each, and the niche width inside it when the niches are on
  const uy = c.mirror.top - 8;                                      // just below the niche tags, which sit at the mirror top
  g.add(dimension([0, uy, D + 2], [PL, uy, D + 2], `upright ${fmt(PL)}`, [0, 1, 0], true));
  g.add(dimension([W - PL, uy, D + 2], [W, uy, D + 2], `upright ${fmt(PL)}`, [0, 1, 0], true));
  if (CONFIG.features.niches) {
    const n = c.niches, cheek = (PL - n.w) / 2, top = n.slots[n.slots.length - 1], ny = c.mirror.top;   // level with the top of the mirror
    g.add(dimension([cheek, ny, D + 1], [cheek + n.w, ny, D + 1], `niche ${fmt(n.w)}`, [0, 1, 0], true));
    g.add(dimension([W - PL + cheek, ny, D + 1], [W - PL + cheek + n.w, ny, D + 1], `niche ${fmt(n.w)}`, [0, 1, 0], true));
    g.add(dimension([PL / 2, top.y, D - n.d], [PL / 2, top.y, D], `${fmt(n.d)} deep`, [1, 0, 0], true));
  }
  if (CONFIG.features.alcove) {                                   // ledge height: from the floor, and above the mattress
    const under = c.ledgeTop - c.ledge;                                 // clear height to the ledge's underside
    g.add(dimension([PL - 4, 0, D + 4], [PL - 4, under, D + 4], `${fmt(under)} clear under the ledge`, [1, 0, 0]));
    g.add(dimension([PL + 3, EFF.bed.topperTop, D + 6], [PL + 3, under, D + 6], `${fmt(under - EFF.bed.topperTop)} above mattress`, [1, 0, 0]));
  }
  if (EFF.bed.frame) {
    const f = EFF.bed.frame, fx = bx - f.side;
    g.add(dimension([fx, f.height + 2, bed.userData.foot + 2], [fx + f.width, f.height + 2, bed.userData.foot + 2], `frame ${fmt(f.width)}`, [0, 1, 0], true));
    g.add(dimension([fx - 4, 0, bed.userData.foot + 2], [fx - 4, f.height, bed.userData.foot + 2], `frame ${fmt(f.height)} tall`, [1, 0, 0], true));
  }
  const foot = bed.userData.foot;
  g.add(dimension([bx + EFF.bed.width + 1, EFF.bed.topperTop + 4, 0], [bx + EFF.bed.width + 1, EFF.bed.topperTop + 4, foot], `foot of bed ${fmt(foot)} from wall`, [1, 0, 0], true));
  return g;
}

// Assemble

let room, wall, bed, doors, dims, ledLight, trayLight;
function rebuild() {
  markBusy();
  EFF = effective();
  const keep = doors ? Object.fromEntries(['doors', 'lids', 'pullouts', 'drawers'].map(k => [k, pieces(k).map(p => p.userData.target)])) : null;
  dims?.traverse(o => o.element?.remove());          // CSS2D labels linger in the DOM unless removed by hand
  reflectors.forEach(m => m.dispose()); reflectors.length = 0;
  for (const o of [room, wall, bed, doors, dims, ledLight, trayLight, ...smallLights]) if (o) scene.remove(o);
  trayLight = null;
  smallLights.length = 0;
  room = buildRoom();
  wall = buildWall(EFF.wall);
  bed = buildBed(EFF.bed, EFF.wall);
  doors = buildDoors(EFF.wall);
  dims = buildDimensions();
  dims.visible = document.getElementById('opt-dims').checked;
  const l = wall.userData.led;
  ledLight = new THREE.RectAreaLight(0xffe2bd, 0, l.w * M, 0.025);
  ledLight.position.set(l.x * M, l.y * M, l.z * M);
  ledLight.lookAt(l.x * M, 0, (l.z - 8) * M);
  const tl = wall.userData.trayLed;
  if (tl) {                                         // neutral white, so things in the tray show their true colours
    trayLight = new THREE.RectAreaLight(0xfff0de, 0, tl.w * M, 0.025);
    trayLight.position.set(tl.x * M, tl.y * M, tl.z * M);
    trayLight.lookAt(tl.x * M, 0, (tl.z + 12) * M);
    scene.add(trayLight);
  }
  for (const p of [wall.userData.lamp]) {
    if (p.rondo) {                                   // a 30 cm luminous face: an area light the size of the disc, leaning back with it
      const rl = new THREE.RectAreaLight(0xf2f5ff, 0, 0.28, 0.28);
      rl.position.set(p.x * M, p.y * M, p.z * M);
      rl.lookAt(p.x * M, (p.y + 100 * Math.sin(p.tilt)) * M, (p.z + 100 * Math.cos(p.tilt)) * M);
      rl.userData.rondo = true;
      smallLights.push(rl);
    } else {
      const pl = new THREE.PointLight(0xffd3a0, 0, 0, 2);
      pl.position.set(p.x * M, p.y * M, p.z * M);
      smallLights.push(pl);
    }
  }
  if (LOOK) applyLook(['le']);
  scene.add(room, wall, bed, doors, dims, ledLight, ...smallLights);
  if (keep) for (const k of Object.keys(keep)) pieces(k).forEach((p, i) => { p.userData.target = p.userData.open = keep[k][i] ?? 0; });
  syncPieceControls();
  renderSpec();
  applyLighting();
}

function renderSpec() {
  const c = EFF.wall, b = EFF.bed, d = CONFIG.room.door;
  const dw = (c.width - 2 * (c.pilaster + c.walnutFrame)) / c.doors.hinges.length;
  const rows = [
    ['Width', `${fmt(c.width)} cm`], ['Depth', `${fmt(c.depth)} cm`], ['Height', `${fmt(c.height)} cm`],
    ['Uprights', `2 × ${fmt(c.pilaster)} cm`],
    ['Mirror', `${fmt(c.width - 2 * c.pilaster)} × ${fmt(c.mirror.top - c.ledgeTop)}`],
    ['Doors', `${c.doors.hinges.length} × ${fmt(dw)} × ${fmt(c.doors.top - c.doors.bottom)}`],
    ['Bed', `${fmt(b.width)} × ${fmt(b.length)}`],
    ['Foot of bed', `${fmt(bed.userData.foot)} cm from wall`],
    ['Door opening', `${fmt(d.x1 - d.x0)} cm`],
  ];
  const V = CONFIG.features, hint = document.querySelector('.spec .hint');
  rows.push(['Lamp', CONFIG.interior.lamp === 'rondo' ? 'Innolux Rondo Air, 24 W, 4000 K, 2040 lm' : 'brass dome, through a grommet']);
  if (V.alcove) rows.push(['Under ledge', `${fmt(c.ledgeTop - c.ledge)} cm clear, ${fmt(c.ledgeTop - c.ledge - b.topperTop)} above mattress`]);
  if (V.tray) rows.push(['Tray', `${fmt(wall.userData.trayWidth)} × ${fmt(c.lids.depth)} × ${fmt(c.depth - 3)} under the lids; 2 sockets + 2 USB-C at the lamp end`]);
  if (V.pullouts) rows.push(['Pull-outs', `2 × ${fmt(c.pilaster)} × ${fmt(c.depth)}, ${c.pullouts.shelves.length + 1} shelves. Probably not structurally sound, see the tooltip`]);
  if (b.frame) {
    const fd = b.frame.drawers;
    rows.push(['Bed frame', `${fmt(b.frame.width)} × ${fmt(bed.userData.frameLength)} × ${fmt(b.frame.height)}`]);
    rows.push(['Bed drawers', `${bedDrawers.length}, trays ${fmt(fd.height)} tall × ${fmt(fd.depth)} deep, fronts ${fmt(b.frame.height - 2.6)}`]);
  }
  if (V.niches) {
    const what = { phone: 'phone on a wireless charging pad', glasses: 'glasses', bottle: '0.5 l bottle' };
    rows.push(['Niches', `${c.niches.slots.length} per side, ${fmt(c.niches.w)} wide × ${fmt(c.niches.d)} deep: ${c.niches.slots.map(sl => `${fmt(sl.h)} for ${what[sl.holds] ?? sl.holds}`).join('; ')}`]);
    const o = c.niches.slots.find(sl => sl.outlets)?.outlets;
    if (o) rows.push(['Bedside power', `${o.sockets} socket + ${o.usbc} USB-C under the phone niche, each side`]);
  }
  document.getElementById('seg-lids').hidden = !V.tray;
  document.getElementById('pullouts-toggle').hidden = !V.pullouts;
  document.getElementById('beddrawers-toggle').hidden = !EFF.bed.frame;

    : 'Click doors, drawers, the lamps, the LED strip and the curtain to work them.';
  const dl = document.getElementById('spec-list');
  dl.replaceChildren(...rows.flatMap(([k, v]) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    return [dt, dd];
  }));
}

// ---------------------------------------------------------------------------
// Day / evening blending
// ---------------------------------------------------------------------------
const state = { t: 0, target: 0, led: EFF.wall.led.default, ledT: EFF.wall.led.default, ledOn: true, lampOn: true, ceilingOn: true, curtainOpen: false, curtainT: 0, pillows: 'small', torch: false };
const smooth = v => v * v * (3 - 2 * v);
const bg = new THREE.Color();
const cA = new THREE.Color(), cB = new THREE.Color();
const lerp = (a, b, t) => a + (b - a) * t;

function applyLighting() {
  const d = LIGHTING.day, e = LIGHTING.evening, t = state.t;
  scene.background = bg.copy(cA.setHex(d.bg)).lerp(cB.setHex(e.bg), t);
  hemi.intensity = lerp(d.hemi, e.hemi, t);
  hemi.color.copy(cA.setHex(d.hemiSky)).lerp(cB.setHex(e.hemiSky), t);
  hemi.groundColor.copy(cA.setHex(d.hemiGround)).lerp(cB.setHex(e.hemiGround), t);
  sun.intensity = lerp(d.sun, e.sun, t);
  sun.visible = sun.intensity > 0.001;
  scene.environmentIntensity = lerp(d.env, e.env, t);
  // Ceiling light and table lamp: switched by clicking them; a little visible even by day
  const ceil = state.ceilingOn ? 1 : 0, lampOn = state.lampOn ? 1 : 0;
  lamp.intensity = (lerp(d.lamp, e.lamp, t) + 0.8 * (1 - t)) * ceil;
  lamp.visible = lamp.intensity > 0.001;
  mat.glow.emissiveIntensity = (lerp(d.glow, e.glow, t) + 1.2 * (1 - t)) * ceil;
  for (const pl of smallLights) {                                           // the Rondo is far brighter than the brass lamp, and cool white
    pl.intensity = (pl.userData.rondo ? 16 + 24 * t : 0.5 + 1.1 * t) * lampOn;
    pl.visible = pl.intensity > 0.001;
  }
  mat.bulb.emissiveIntensity = (2 + 3 * t) * lampOn;
  mat.rondoFace.emissiveIntensity = (1.6 + 1.4 * t) * lampOn;
  renderer.toneMappingExposure = lerp(d.exposure, e.exposure, t);
  torch.intensity = 6 + 10 * t;                                            // the torch holds its own against daylight, and more so in the evening
  // Mirror LED: dimmable, independent of the time of day
  ledLight.intensity = 70 * state.ledT;
  mat.ledStrip.emissiveIntensity = 5 * state.ledT;
  // Tray LED follows the lids (a lid sensor): on as soon as a lid starts to lift
  const lidLit = Math.min(1, lids.reduce((m, l) => Math.max(m, l.userData.open), 0) * 3);
  if (trayLight) trayLight.intensity = 28 * lidLit;
  mat.trayLedStrip.emissiveIntensity = 4 * lidLit;
  lineMat.color.setHex(t > 0.5 ? 0xd8d2c6 : 0x1a1a1a);
}

function setMode(evening) {
  state.target = evening ? 1 : 0;
  document.getElementById('btn-day').setAttribute('aria-pressed', String(!evening));
  document.getElementById('btn-evening').setAttribute('aria-pressed', String(evening));
  markBusy();
  if (reduceMotion) state.t = state.target;
  writeUrl();
}
document.getElementById('btn-day').addEventListener('click', () => setMode(false));
document.getElementById('btn-evening').addEventListener('click', () => setMode(true));
const dimmer = document.getElementById('led-dim');
dimmer.value = Math.round(state.led * 100);
dimmer.addEventListener('input', e => { state.led = e.target.value / 100; state.ledOn = state.led > 0; if (reduceMotion) state.ledT = state.led; writeUrl(); });
// Heavy changes (a light switched, a material swapped, a rebuild) stall for a moment while shaders
// recompile. Show a busy cursor and a badge from the request until the frame after it has drawn.
const busyEl = document.getElementById('busy');
let busyFrames = 0;
function markBusy() {
  busyFrames = 3;                                           // this frame compiles; clear once a couple more have drawn
  document.body.classList.add('is-busy');
  busyEl.hidden = false;
}
function tickBusy() {
  if (busyFrames > 0 && --busyFrames === 0) { document.body.classList.remove('is-busy'); busyEl.hidden = true; }
}
function setLed(on) { markBusy(); state.ledOn = on; if (on && state.led === 0) state.led = EFF.wall.led.default; dimmer.value = Math.round((on ? state.led : 0) * 100); writeUrl(); }
function setLamp(on) { markBusy(); state.lampOn = on; writeUrl(); }
function setCeiling(on) { markBusy(); state.ceilingOn = on; writeUrl(); }
function setCurtain(open) { state.curtainOpen = open; if (reduceMotion) state.curtainT = open ? 1 : 0; writeUrl(); }

// Doors, lids, pull-outs and bed drawers each move on their own: click one to work it, or use the
// bar's buttons for all of them at once. The bar shows the combined state.
function pieces(kind) { return kind === 'doors' ? (doors?.children ?? []) : kind === 'lids' ? lids : kind === 'pullouts' ? pullouts : bedDrawers; }
function togglePiece(p) {
  p.userData.target = p.userData.target ? 0 : 1;
  if (reduceMotion) p.userData.open = p.userData.target;
  syncPieceControls(); writeUrl();
}
function setAll(kind, open) {
  for (const p of pieces(kind)) { p.userData.target = open ? 1 : 0; if (reduceMotion) p.userData.open = p.userData.target; }
  syncPieceControls(); writeUrl();
}
function syncPieceControls() {
  const all = kind => pieces(kind).length > 0 && pieces(kind).every(p => p.userData.target);
  const none = kind => pieces(kind).every(p => !p.userData.target);
  document.getElementById('door-closed').setAttribute('aria-pressed', String(none('doors')));
  document.getElementById('door-open').setAttribute('aria-pressed', String(all('doors')));
  document.getElementById('lid-closed').setAttribute('aria-pressed', String(none('lids')));
  document.getElementById('lid-open').setAttribute('aria-pressed', String(all('lids')));
  for (const [id, kind] of [['opt-pullouts', 'pullouts'], ['opt-beddrawers', 'drawers']]) {
    const el = document.getElementById(id);
    el.checked = all(kind); el.indeterminate = !all(kind) && !none(kind);
  }
}
function setDoors(mode) { setAll('doors', mode === 'open'); }
for (const m of ['closed', 'open'])
  document.getElementById(`door-${m}`).addEventListener('click', () => setDoors(m));
// Feature checkboxes: some combinations don't make sense, so turning one on switches its rivals off,
// and a feature whose rival is on is greyed out. The active set is kept in the URL hash.
const EXCLUDES = { alcove: ['tray'], tray: ['alcove'], niches: ['pullouts'], pullouts: ['niches'] };
const FEATURE_NAMES = { alcove: 'the alcove', tray: 'the tray', frame: 'the bed frame', niches: 'the niches', pullouts: 'the pull-outs' };
const featureBoxes = [...document.querySelectorAll('[data-feature]')];
function setFeature(name, on) {
  CONFIG.features[name] = on;
  if (on) for (const other of EXCLUDES[name] ?? []) CONFIG.features[other] = false;
  syncFeatures();
  rebuild();
  writeUrl();
}
// The whole setup lives in the URL so a link reproduces it: features and every control in the bar.
// e.g. ?f=tray,niches&light=evening&doors=open&lids=open&led=40&dims=off
// Served from a file:// URL the browser refuses query changes, so the same thing goes in the hash instead:
// #tray,niches,evening,open,lids,led=40,nodims (also still read, so older links keep working).
let urlReady = false;
function writeUrl() {
  if (!urlReady) return;
  const q = new URLSearchParams(), t = [];
  const f = Object.keys(CONFIG.features).filter(k => CONFIG.features[k]);
  if (f.length) { q.set('f', f.join(',')); t.push(...f); }
  if (state.target) { q.set('light', 'evening'); t.push('evening'); }
  // Pieces: 'open'/'out' when all are, otherwise the 1-based numbers of the open ones
  const listOf = kind => { const ps = pieces(kind), on = ps.map((p, i) => p.userData.target ? i + 1 : 0).filter(Boolean);
    return !on.length ? null : on.length === ps.length ? 'all' : on.join(','); };
  for (const [kind, name, allWord, token] of [['doors', 'doors', 'open', 'open'], ['lids', 'lids', 'open', 'lids'], ['pullouts', 'pullouts', 'out', 'out'], ['drawers', 'drawers', 'out', 'drawers']]) {
    const v = listOf(kind);
    if (v) { q.set(name, v === 'all' ? allWord : v); t.push(v === 'all' ? token : `${name}=${v}`); }
  }
  if (CONFIG.interior.lamp !== 'brass') { q.set('lampmodel', CONFIG.interior.lamp); t.push(`lampmodel=${CONFIG.interior.lamp}`); }
  if (!state.lampOn) { q.set('lamp', 'off'); t.push('lamp-off'); }
  if (!state.ceilingOn) { q.set('ceiling', 'off'); t.push('ceiling-off'); }
  if (state.curtainOpen) { q.set('curtain', 'open'); t.push('curtain'); }
  const led = state.ledOn ? Math.round(state.led * 100) : 0;
  if (led !== Math.round(EFF.wall.led.default * 100)) { q.set('led', led); t.push(`led=${led}`); }
  if (!document.getElementById('opt-dims').checked) { q.set('dims', 'off'); t.push('nodims'); }
  if (state.pillows !== 'small') { q.set('pillows', state.pillows); t.push(`pillows=${state.pillows}`); }
  if (LOOK) {                                     // the mood, then only the surfaces that differ from it
    if (LOOK_MOOD !== 'drawn') { q.set('mood', LOOK_MOOD); t.push(`mood=${LOOK_MOOD}`); }
    const base = moodValues(LOOK_MOOD);
    for (const k of Object.keys(LOOK_SCHEMA)) {
      const enc = encodeSurface(k), ref = LOOK_SCHEMA[k].fields.map(([f]) => base[k][f]).join('.');
      if (enc !== ref) { q.set(k, enc); t.push(`${k}=${enc}`); }
    }
  }
  const qs = q.toString().replace(/%2C/g, ',');
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); }
  catch { history.replaceState(null, '', t.length ? '#' + t.join(',') : location.pathname); }
}
function syncFeatures() {
  for (const box of featureBoxes) {
    const n = box.dataset.feature, rival = (EXCLUDES[n] ?? []).find(o => CONFIG.features[o]);
    box.checked = !!CONFIG.features[n];
    box.disabled = !!rival;
    box.closest('label').classList.toggle('off', !!rival);
    box.closest('label').title = rival ? `Not together with ${FEATURE_NAMES[rival]}` : (box.closest('label').dataset.note ?? '');
  }
}
for (const box of featureBoxes) box.addEventListener('change', e => setFeature(box.dataset.feature, e.target.checked));
// Interior choices (the lamp model, for now): rebuild on change, kept in the URL as well
const interiorSelects = [...document.querySelectorAll('[data-interior]')];
function setInterior(name, value) {
  CONFIG.interior[name] = value;
  syncInterior(); rebuild(); writeUrl();
}
function syncInterior() { for (const sel of interiorSelects) sel.value = CONFIG.interior[sel.dataset.interior]; }
for (const sel of interiorSelects) sel.addEventListener('change', e => setInterior(sel.dataset.interior, e.target.value));

function setLids(mode) { setAll('lids', mode === 'open'); }
for (const m of ['closed', 'open'])
  document.getElementById(`lid-${m}`).addEventListener('click', () => setLids(m));
function setPullouts(out) { setAll('pullouts', out); }
document.getElementById('opt-pullouts').addEventListener('change', e => setPullouts(e.target.checked));
function setBedDrawers(out) { setAll('drawers', out); }
document.getElementById('opt-beddrawers').addEventListener('change', e => setBedDrawers(e.target.checked));
document.getElementById('opt-dims').addEventListener('change', e => { dims.visible = e.target.checked; writeUrl(); });
function setPillows(style) {
  state.pillows = style;
  for (const m of ['big', 'small']) document.getElementById(`pillows-${m}`).setAttribute('aria-pressed', String(m === style));
  if (bed) rebuild();
  writeUrl();
}
for (const m of ['big', 'small']) document.getElementById(`pillows-${m}`).addEventListener('click', () => setPillows(m));
// Collapsible spec panel; the choice is remembered in this browser
const specPanel = document.getElementById('spec'), foldBtn = document.getElementById('btn-fold');
function setFold(collapsed) {
  specPanel.classList.toggle('collapsed', collapsed);
  foldBtn.setAttribute('aria-expanded', String(!collapsed));
  foldBtn.innerHTML = collapsed ? '&#9656;' : '&#9662;';
  foldBtn.title = collapsed ? 'Expand the panel' : 'Collapse the panel';
  try { localStorage.setItem('bedwall-spec-collapsed', collapsed ? '1' : '0'); } catch {}
}
foldBtn.addEventListener('click', () => setFold(!specPanel.classList.contains('collapsed')));
const dimsFold = document.getElementById('dims-fold');
dimsFold.addEventListener('toggle', () => { try { localStorage.setItem('bedwall-dims-folded', dimsFold.open ? '0' : '1'); } catch {} });
try { if (localStorage.getItem('bedwall-dims-folded') === '1') dimsFold.open = false; } catch {}
try { if (localStorage.getItem('bedwall-spec-collapsed') === '1') setFold(true); } catch {}
// Look panel: moods as chips, then one row per surface that opens to its controls
const lookPanel = document.getElementById('look'), foldLookBtn = document.getElementById('btn-fold-look');
let openSurface = null;
function renderLookPanel() {
  const moods = document.getElementById('moods');
  moods.replaceChildren(...Object.entries(MOODS).map(([k, m]) => {
    const b = document.createElement('button'); b.textContent = m.label; b.setAttribute('aria-pressed', String(k === LOOK_MOOD));
    b.addEventListener('click', () => setMood(k)); return b;
  }));
  const list = document.getElementById('surfaces');
  list.replaceChildren(...Object.entries(LOOK_SCHEMA).map(([k, sc]) => {
    const row = document.createElement('div'); row.className = 'surface' + (openSurface === k ? ' open' : '');
    const head = document.createElement('button');
    const sw = document.createElement('span'); sw.className = 'sw';
    const colorField = sc.fields.find(([, t]) => t === 'color');
    sw.style.background = colorField ? '#' + LOOK[k][colorField[0]] : k === 'wd' ? '#' + toHex(WOODS[LOOK.wd.species]) : k === 'mt' ? '#' + METALS[LOOK.mt.finish][0].toString(16).padStart(6, '0') : 'transparent';
    const name = document.createElement('span'); name.textContent = sc.label;
    const sum = document.createElement('span'); sum.className = 'sum';
    sum.textContent = sc.fields.filter(([, t]) => t === 'select').map(([f, , o]) => o.options[LOOK[k][f]]).join(', ');
    head.append(sw, name, sum);
    head.addEventListener('click', () => { openSurface = openSurface === k ? null : k; renderLookPanel(); });
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    for (const [f, type, opts] of sc.fields) {
      const lab = document.createElement('label');
      const cap = document.createElement('span'); cap.textContent = opts.label ?? (type === 'color' ? 'Colour' : f[0].toUpperCase() + f.slice(1));
      lab.append(cap);
      if (type === 'select') {
        const sel = document.createElement('select');
        for (const [v, t] of Object.entries(opts.options)) { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.append(o); }
        sel.value = LOOK[k][f];
        sel.addEventListener('change', e => setLookField(k, f, e.target.value));
        lab.append(sel);
      } else if (type === 'range') {
        const r = document.createElement('input'); r.type = 'range'; r.min = opts.min ?? 0; r.max = opts.max ?? 100; r.step = 1; r.value = LOOK[k][f];
        r.addEventListener('input', e => { LOOK[k][f] = Number(e.target.value); applyLook([k]); });
        r.addEventListener('change', e => setLookField(k, f, Number(e.target.value)));
        lab.append(r);
      } else {
        const chips = document.createElement('span'); chips.className = 'chips';
        for (const c of opts.chips) {
          const b = document.createElement('button'); b.style.background = '#' + c; b.title = '#' + c;
          b.setAttribute('aria-pressed', String(LOOK[k][f] === c));
          b.addEventListener('click', () => setLookField(k, f, c)); chips.append(b);
        }
        const pick = document.createElement('input'); pick.type = 'color'; pick.value = '#' + LOOK[k][f]; pick.title = 'Any colour';
        pick.addEventListener('input', e => { LOOK[k][f] = e.target.value.slice(1); applyLook([k]); });
        pick.addEventListener('change', e => setLookField(k, f, e.target.value.slice(1)));
        chips.append(pick);
        lab.append(chips);
      }
      ctl.append(lab);
    }
    row.append(head, ctl);
    return row;
  }));
}
function setLookFold(collapsed) {
  lookPanel.classList.toggle('collapsed', collapsed);
  foldLookBtn.setAttribute('aria-expanded', String(!collapsed));
  foldLookBtn.innerHTML = collapsed ? '&#9666;' : '&#9662;';
  foldLookBtn.title = collapsed ? 'Expand the panel' : 'Collapse the panel';
  try { localStorage.setItem('bedwall-look-collapsed', collapsed ? '1' : '0'); } catch {}
}
foldLookBtn.addEventListener('click', () => setLookFold(!lookPanel.classList.contains('collapsed')));
try { if (localStorage.getItem('bedwall-look-collapsed') === '1') setLookFold(true); } catch {}
document.getElementById('btn-look-reset').addEventListener('click', () => { openSurface = null; setMood('drawn'); });
document.getElementById('btn-copy').addEventListener('click', async e => {
  try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Copied'; }
  catch { prompt('Copy this link', location.href); }
  setTimeout(() => { e.target.textContent = 'Copy link'; }, 1500);
});
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update();
});

// Clicking things in the model works them: doors, lids, drawers, pull-outs, the lamps, the LED strip and
// the curtain. The cursor shows when something under it is clickable; a drag still orbits the camera.
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
function probe(e) {                                   // what's under the cursor: the nearest click handler and note up the tree
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects([wall, doors, bed, room], true)[0];
  let click = null, tip = null;
  for (let o = hit?.object; o; o = o.parent) { click ??= o.userData.click ? o : null; tip ??= o.userData.tip ?? null; }
  return { click, tip, hit };
}
// Put the torch 35 cm back from the hit point along the line of sight, aimed at the point
function aimTorch(hit) {
  if (!state.torch) return;
  if (!hit) { torch.visible = false; return; }
  const dir = hit.point.clone().sub(camera.position).normalize();
  torch.position.copy(hit.point).addScaledVector(dir, -0.35);
  torch.target.position.copy(hit.point);
  torch.visible = true;
}
function clickableAt(e) { return probe(e).click; }
const tipEl = document.getElementById('tip');
function showTip(html, x, y) {
  if (!html) { tipEl.hidden = true; return; }
  tipEl.innerHTML = html; tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = `${x + 16 + w > innerWidth ? x - 16 - w : x + 16}px`;
  tipEl.style.top = `${y + 16 + h > innerHeight ? y - 16 - h : y + 16}px`;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  clickableAt(e)?.userData.click();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) { showTip(null); return; }
  const { click, tip, hit } = probe(e);
  renderer.domElement.style.cursor = click ? 'pointer' : '';
  showTip(tip, e.clientX, e.clientY);
  aimTorch(hit);
});
renderer.domElement.addEventListener('pointerleave', () => { showTip(null); torch.visible = false; });
function setTorch(on) {
  markBusy();
  state.torch = on;
  document.getElementById('opt-torch').checked = on;
  if (!on) torch.visible = false;
}
document.getElementById('opt-torch').addEventListener('change', e => setTorch(e.target.checked));
renderer.domElement.addEventListener('pointerdown', () => showTip(null));

// Keep the camera inside the room while it's in there; zoomed out past the open
// front of the room it may roam freely (a cut-away view), staying above the floor.
const clampBox = new THREE.Box3(new THREE.Vector3(ROOM.xMin * M + 0.08, 0.15, 0.1),
                                new THREE.Vector3(ROOM.xMax * M - 0.08, CONFIG.room.ceiling * M - 0.1, ROOM.zFront * M - 0.1));
controls.addEventListener('change', () => {
  if (camera.position.z < clampBox.max.z) clampBox.clampPoint(camera.position, camera.position);
  else camera.position.y = Math.max(camera.position.y, 0.15);
  controls.target.clamp(new THREE.Vector3(-0.6, 0.2, 0), new THREE.Vector3(1.85, 2.5, 2.2));
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

// Deep links: read the query parameters (see writeUrl) and, as a fallback, hash tokens such as #alcove,niches,evening
const tokens = new Set(location.hash.slice(1).split(/[,+]/).filter(Boolean));
const query = new URLSearchParams(location.search);
for (const f of (query.get('f') ?? '').split(',')) if (f) tokens.add(f);
if (query.get('light') === 'evening') tokens.add('evening');
if (query.has('led')) tokens.add('led=' + query.get('led'));
if (query.get('lamp') === 'off') tokens.add('lamp-off');
if (query.get('ceiling') === 'off') tokens.add('ceiling-off');
if (query.get('curtain') === 'open') tokens.add('curtain');
if (query.get('dims') === 'off') tokens.add('nodims');
if (query.get('pillows') === 'big') tokens.add('pillows=big');
for (const k of Object.keys(CONFIG.features)) if (tokens.has(k)) { CONFIG.features[k] = true; for (const o of EXCLUDES[k] ?? []) CONFIG.features[o] = false; }
{ const lm = query.get('lampmodel') ?? [...tokens].find(tk => tk.startsWith('lampmodel='))?.slice(10);
  if (lm && [...document.getElementById('opt-lamp').options].some(o => o.value === lm)) CONFIG.interior.lamp = lm; }
syncFeatures();
syncInterior();
{ const m = query.get('mood') ?? [...tokens].find(tk => tk.startsWith('mood='))?.slice(5);
  LOOK_MOOD = m in MOODS ? m : 'drawn'; LOOK = moodValues(LOOK_MOOD);
  for (const k of Object.keys(LOOK_SCHEMA)) {
    const v = query.get(k) ?? [...tokens].find(tk => tk.startsWith(k + '='))?.slice(k.length + 1);
    if (v) Object.assign(LOOK[k], decodeSurface(k, v));
  }
  applyLook(); renderLookPanel(); }
rebuild();
// Pieces: 'open'/'out' means all of them, otherwise a list of 1-based numbers
const pieceParam = (name, allWord, token) => {
  if (tokens.has(token)) return 'all';
  const v = query.get(name);
  if (!v) return null;
  if (v === allWord) return 'all';
  const nums = v.split(',').map(Number).filter(Number.isFinite);
  return nums.length ? nums : null;
};
for (const [kind, name, allWord, token] of [['doors', 'doors', 'open', 'open'], ['lids', 'lids', 'open', 'lids'], ['pullouts', 'pullouts', 'out', 'out'], ['drawers', 'drawers', 'out', 'drawers']]) {
  const v = pieceParam(name, allWord, token) ?? (tokens.has('open-evening') && kind === 'doors' ? 'all' : null);
  if (v) pieces(kind).forEach((p, i) => { if (v === 'all' || v.includes(i + 1)) p.userData.target = p.userData.open = 1; });
}
syncPieceControls();
if (tokens.has('evening') || tokens.has('open-evening')) { setMode(true); state.t = 1; }
if (tokens.has('lamp-off')) state.lampOn = false;
if (tokens.has('ceiling-off')) state.ceilingOn = false;
if (tokens.has('curtain')) { state.curtainOpen = true; state.curtainT = 1; }
for (const tk of tokens) if (tk.startsWith('led=')) {
  const v = Math.min(100, Math.max(0, Number(tk.slice(4)) || 0));
  state.ledOn = v > 0; if (v > 0) state.led = v / 100; state.ledT = v / 100; dimmer.value = v;
}
if (tokens.has('nodims')) { document.getElementById('opt-dims').checked = false; dims.visible = false; }
if (tokens.has('pillows=big')) setPillows('big');
urlReady = true;
writeUrl();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = 1 - Math.exp(-dt * 5);
  state.t = lerp(state.t, state.target, k);
  state.ledT = lerp(state.ledT, state.ledOn ? state.led : 0, k * 1.5);
  const step = (p, rate) => { p.userData.open = lerp(p.userData.open, p.userData.target, k * rate); return smooth(p.userData.open); };
  for (const p of doors.children) p.rotation.y = p.userData.sign * p.userData.max * step(p, 0.8);
  for (const l of lids) l.rotation.x = -l.userData.max * step(l, 0.8);
  for (const u of pullouts) u.position.z = u.userData.travel * step(u, 1.2) * M;
  for (const d of bedDrawers) d.position[d.userData.axis] = d.userData.sign * d.userData.travel * step(d, 1.2) * M;
  state.curtainT = lerp(state.curtainT, state.curtainOpen ? 1 : 0, k * 0.9);
  room.userData.curtain.scale.x = 1 - 0.72 * smooth(state.curtainT);
  applyLighting();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  tickBusy();
});

// Handy for poking at numbers from the console: edit bedwall.CONFIG, then bedwall.rebuild()
window.bedwall = { CONFIG, rebuild, camera, controls };
</script>
