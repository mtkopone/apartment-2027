<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Apartment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f4f2ee; --fg: #24221e; --muted: #6d685f; --line: rgba(36, 34, 30, 0.12); --accent: #8f5f32; --card: #fbfaf7;
    --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15130f; --fg: #eeeae2; --muted: #a49e92; --line: rgba(238, 234, 226, 0.14); --accent: #d49a5f; --card: #1d1b17; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 28px; }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li a { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
         background: var(--card); color: inherit; text-decoration: none; }
  li a:hover, li a:focus-visible { border-color: var(--accent); outline: none; }
  .name { font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; }
</style>
<main>
  <h1>New Apartment</h1>
  <ul>
    <li><a href="aava-wardrobe/"><span class="name">Aava's wardrobe</span><span class="desc">Interactive 3D versions of the custom cabinet for the bedroom niche.</span></a></li>
  </ul>
</main>
